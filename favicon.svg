<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3c3c"/>
      <stop offset="100%" stop-color="#cc1818"/>
    </linearGradient>
    <linearGradient id="gc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ccb4"/>
      <stop offset="100%" stop-color="#00ffe0"/>
    </linearGradient>
  </defs>

  <!-- Dark background pill -->
  <rect width="32" height="32" rx="7" fill="#04050a"/>

  <!-- Left angle bracket < in red — drawn with paths for crispness -->
  <!-- Top bar going down-right -->
  <polygon points="4,16 10,9 12,11 7.5,16 12,21 10,23" fill="url(#gr)"/>

  <!-- Right angle bracket > in cyan -->
  <polygon points="28,16 22,9 20,11 24.5,16 20,21 22,23" fill="url(#gc)"/>

  <!-- Center slash / in white -->
  <rect x="14.2" y="8" width="3.6" height="16" rx="1.4"
        transform="rotate(-18 16 16)" fill="#f5f4ff" opacity="0.92"/>
</svg>