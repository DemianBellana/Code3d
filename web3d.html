<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CODE NO FRONTIER — Web3D Hub</title>
<!-- TIPOGRAFÍA ADN MAESTRO -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@200;400;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #ff3c3c;
    --accent2: #00ffe0;
    --bg: #04060d;
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.4);
    --glass: rgba(10, 12, 20, 0.6);
    --border: rgba(255, 255, 255, 0.05);
  }
  
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    overflow: hidden; font-family: 'Outfit', sans-serif;
    cursor: none; user-select: none;
  }

  /* ─── MASTER CANVAS ─── */
  #webgl-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; }
  
  /* OVERLAYS ADN SERVICIOS */
  .vignette { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0,0,0,0.85) 100%); z-index: 5; pointer-events: none; }
  .noise { position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .scanlines { position: fixed; inset: 0; z-index: 7; pointer-events: none; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px); }

  /* ─── NAV ADN MAESTRO ─── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.8rem 4vw; backdrop-filter: blur(10px);
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.1em;
    color: #fff; text-decoration: none; display: flex; align-items: center;
  }
  .logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 3rem; list-style: none; }
  .nav-links a {
    color: var(--muted); text-decoration: none; font-size: 0.75rem;
    letter-spacing: 0.2em; text-transform: uppercase; transition: color 0.4s;
  }
  .nav-links a:hover { color: #fff; }

  /* ─── HANGAR SLIDER ─── */
  .hangar-container { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; perspective: 2000px; }
  .slider { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transform-style: preserve-3d; }
  
  .card {
    position: absolute; width: 420px; height: 580px;
    background: var(--glass); border: 1px solid var(--border); border-radius: 20px;
    display: flex; flex-direction: column; overflow: hidden;
    transform-origin: center center; transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s, border-color 0.4s;
    backdrop-filter: blur(40px) saturate(140%); -webkit-backdrop-filter: blur(40px) saturate(140%);
    pointer-events: none; opacity: 0; text-decoration: none; cursor: none;
    box-shadow: 0 40px 100px rgba(0,0,0,0.6);
  }
  
  .card.active { pointer-events: all; opacity: 1; border-color: rgba(255,255,255,0.15); box-shadow: 0 50px 120px rgba(0,0,0,0.9), 0 0 40px rgba(255,60,60,0.05); }
  .card.prev, .card.next { opacity: 0.15; pointer-events: all; }
  
  /* Portal Viewport */
  .portal-view { position: relative; width: 100%; height: 60%; background: #000; overflow: hidden; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .portal-view::after { content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(4,6,13,1), transparent 30%); pointer-events:none; }

  .card-info { padding: 2.5rem; flex: 1; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(to bottom, transparent 0%, rgba(4,6,13,0.8) 100%); }
  .card-id { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--accent2); letter-spacing: 0.4em; }
  .card-title { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; font-weight: 400; line-height: 0.9; color: #fff; margin: 0.8rem 0; letter-spacing: 0.02em; }
  .card-desc { font-family: 'Outfit', sans-serif; font-size: 0.95rem; color: var(--muted); line-height: 1.6; font-weight: 300; }
  
  .btn-enter { 
    align-self: flex-start; margin-top: 1.5rem; padding: 1rem 2rem; 
    background: var(--accent); color: #fff; border: none; 
    font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; 
    letter-spacing: 0.1em; border-radius: 4px; transition: all 0.4s;
    box-shadow: 0 10px 30px rgba(255, 60, 60, 0.3);
  }
  .card.active:hover .btn-enter { transform: translateX(10px) scale(1.05); box-shadow: 0 15px 40px rgba(255, 60, 60, 0.5); }

  /* ─── CURSOR ADN SERVICIOS ─── */
  #cursor { position: fixed; width: 8px; height: 8px; background: #fff; border-radius: 50%; pointer-events: none; z-index: 10000; transform: translate(-50%,-50%); mix-blend-mode: difference; }
  #cursor-ring { position: fixed; width: 38px; height: 38px; border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); transition: width 0.3s, height 0.3s, border-color 0.3s; }

  /* ─── FOOTER HUD ─── */
  .footer-hud { position: absolute; bottom: 0; left: 0; right: 0; padding: 3rem 4vw; z-index: 100; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
  .status-line { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); letter-spacing: 0.3em; text-transform: uppercase; }
  .status-line span { color: var(--accent2); }

  @media(max-width:768px){
    .card { width: 88vw; height: 75vh; }
    .card-title { font-size: 2.2rem; }
    header { padding: 1.5rem 2rem; }
    .nav-links { display: none; }
  }
</style>
</head>
<body>

<div class="noise"></div>
<div class="vignette"></div>
<div class="scanlines"></div>
<div id="cursor"></div>
<div id="cursor-ring"></div>

<canvas id="webgl-canvas"></canvas>

<nav>
  <a href="index.html" class="logo">CODE<span>NO</span>FRONTIER</a>
  <ul class="nav-links">
    <li><a href="index.html#servicios">Servicios</a></li>
    <li><a href="index.html#proceso">Proceso</a></li>
    <li><a href="index.html#contacto">Contacto</a></li>
  </ul>
</nav>

<div class="hangar-container">
  <div class="slider" id="slider">
    <!-- GENERATED BY JS -->
  </div>
</div>

<div class="footer-hud">
  <div class="status-line">TERMINAL: <span>ONLINE</span> // SECTOR_ACTIVE: <span id="node-id">01</span></div>
  <div class="status-line">SWIPE / SCROLL DIMENSIONS</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

  const models = [
    { id: '01', title: 'NEURAL AI', desc: 'Sincronización de sinapsis neuronales y núcleos de consciencia artificial.', type: 'neural', link: 'web3d/model-01.html' },
    { id: '02', title: 'CORPORATE CORE', desc: 'Arquitectura estéril de procesamiento masivo y protocolos corporativos.', type: 'crystal', link: 'web3d/model-02/index.html' },
    { id: '03', title: 'COSMIC LAYER', desc: 'Simulación astrofísica de horizontes de sucesos y nubes galácticas.', type: 'galaxy', link: 'web3d/model-03/index.html' },
    { id: '04', title: 'OPERATING SYS', desc: 'Capas operativas y flujos logísticos de datos en tiempo real.', type: 'rings', link: 'web3d/model-04/index.html' },
    { id: '05', title: 'NEURAL CHAMBER', desc: 'Refinamiento estético y sensorial mediante metal líquido fractal.', type: 'liquid', link: 'web3d/model-05/index.html' },
    { id: '06', title: 'FORBIDDEN NET', desc: 'Sub-capas de entropía controlada y redes de datos prohibidas.', type: 'grid', link: 'web3d/model-06/index.html' },
    { id: '07', title: 'DIMENSIONAL GW', desc: 'Punto de enlace cuántico entre la consciencia y el multiverso.', type: 'portal', link: 'web3d/model-07/index.html' },
    { id: '08', title: 'SYNTHETIC CITY', desc: 'Megaciudad generativa instanciada bajo cielos de datos rojos.', type: 'city', link: 'web3d/model-08/index.html' },
    { id: '09', title: 'TACTICAL NEXUS', desc: 'Centro de comando táctico y visualización de amenazas globales.', type: 'globe', link: 'web3d/model-09/index.html' },
    { id: '10', title: 'TRANSCENDENCE', desc: 'La evolución final. Singularidad alcanzada y omnipresencia digital.', type: 'fractal', link: 'web3d/model-10/index.html' }
  ];

  // ─── ENGINE SETUP ───
  const canvas = document.getElementById('webgl-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const hangarCamera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
  hangarCamera.position.z = 22;

  // ─── PORTAL PREVIEW ENGINE ───
  const portalScenes = models.map((m, i) => {
    const scene = new THREE.Scene();
    let obj;
    if(m.type === 'neural') {
       obj = new THREE.Points(new THREE.IcosahedronGeometry(4, 2), new THREE.PointsMaterial({color: 0x00f0ff, size: 0.1}));
    } else if(m.type === 'crystal') {
       obj = new THREE.Mesh(new THREE.IcosahedronGeometry(4, 0), new THREE.MeshBasicMaterial({color: 0xffffff, wireframe: true}));
    } else if(m.type === 'galaxy') {
       obj = new THREE.Points(new THREE.SphereGeometry(4, 32, 32), new THREE.PointsMaterial({color: 0xa855f7, size: 0.05}));
    } else if(m.type === 'rings') {
       obj = new THREE.Mesh(new THREE.TorusGeometry(3, 0.1, 8, 50), new THREE.MeshBasicMaterial({color: 0x00f0ff, wireframe: true}));
    } else if(m.type === 'liquid') {
       obj = new THREE.Mesh(new THREE.SphereGeometry(3.5, 32, 32), new THREE.MeshStandardMaterial({color: 0xc8a97a, metalness: 1, roughness: 0.1}));
       const l = new THREE.PointLight(0xffffff, 2); l.position.set(5,5,5); scene.add(l);
    } else if(m.type === 'grid') {
       obj = new THREE.Mesh(new THREE.PlaneGeometry(10, 10, 10, 10), new THREE.MeshBasicMaterial({color: 0x00ff00, wireframe: true}));
       obj.rotation.x = -Math.PI/2;
    } else if(m.type === 'portal') {
       obj = new THREE.Mesh(new THREE.TorusGeometry(4, 0.5, 8, 50), new THREE.MeshBasicMaterial({color: 0xff00ff, wireframe: true}));
    } else if(m.type === 'city') {
       obj = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 4), new THREE.MeshBasicMaterial({color: 0xff3c3c, wireframe: true}));
    } else if(m.type === 'globe') {
       obj = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 16), new THREE.MeshBasicMaterial({color: 0xff3c3c, wireframe: true}));
    } else {
       obj = new THREE.Mesh(new THREE.TorusKnotGeometry(3, 1, 100, 16), new THREE.MeshBasicMaterial({color: 0xffffff, wireframe: true}));
    }
    scene.add(obj);
    scene.userData.obj = obj;
    return scene;
  });

  // ─── UI GENERATION ───
  const slider = document.getElementById('slider');
  models.forEach((m, i) => {
    const el = document.createElement('a');
    el.href = m.link;
    el.className = \`card\`;
    el.innerHTML = \`
      <div class="portal-view" id="portal-\${i}"></div>
      <div class="card-info">
        <div>
          <div class="card-id">SECTOR // \${m.id}</div>
          <h2 class="card-title">\${m.title}</h2>
          <p class="card-desc">\${m.desc}</p>
        </div>
        <button class="btn-enter">PENETRAR DIMENSIÓN →</button>
      </div>
    \`;
    slider.appendChild(el);
    el.addEventListener('click', (e) => {
      e.preventDefault();
      if(!el.classList.contains('active')) {
         targetIndex = i;
         updateSlider();
      } else {
         gsap.to(hangarCamera.position, { z: 4, duration: 1.5, ease: 'expo.inOut', onComplete: () => window.location.href = el.href });
         gsap.to(el, { scale: 1.5, opacity: 0, duration: 1.2 });
      }
    });
  });

  const cards = document.querySelectorAll('.card');
  let activeIndex = 0;
  let targetIndex = 0;

  function updateSlider() {
    activeIndex = targetIndex;
    document.getElementById('node-id').innerText = models[activeIndex].id;
    cards.forEach((card, i) => {
      card.classList.remove('active', 'prev', 'next');
      const offset = i - activeIndex;
      if (offset === 0) {
        card.classList.add('active');
        card.style.transform = \`translate3d(0, 0, 0) scale(1) rotateY(0deg)\`;
        card.style.zIndex = 10;
      } else if (offset === -1) {
        card.classList.add('prev');
        card.style.transform = \`translate3d(-400px, 0, -350px) scale(0.8) rotateY(25deg)\`;
        card.style.zIndex = 5;
      } else if (offset === 1) {
        card.classList.add('next');
        card.style.transform = \`translate3d(400px, 0, -350px) scale(0.8) rotateY(-25deg)\`;
        card.style.zIndex = 5;
      } else {
        const sign = Math.sign(offset);
        card.style.transform = \`translate3d(\${sign * 900}px, 0, -700px) scale(0.4) rotateY(\${sign * -40}deg)\`;
        card.style.zIndex = 1;
      }
    });
  }

  // ─── INPUTS ───
  let scrollAccum = 0;
  window.addEventListener('wheel', e => {
    scrollAccum += e.deltaY;
    if (Math.abs(scrollAccum) > 80) {
      targetIndex = Math.max(0, Math.min(models.length - 1, activeIndex + (scrollAccum > 0 ? 1 : -1)));
      scrollAccum = 0;
      updateSlider();
    }
  });

  let mx=0, my=0;
  window.addEventListener('mousemove', e => {
    mx=e.clientX; my=e.clientY;
    gsap.to('#cursor', {x:mx, y:my, duration:0.1});
    gsap.to('#cursor-ring', {x:mx, y:my, duration:0.4});
  });

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
    renderer.setScissorTest(false);
    renderer.clear();
    
    cards.forEach((card, i) => {
      if (Math.abs(i - activeIndex) > 1) return;
      const rect = document.getElementById(\`portal-\${i}\`).getBoundingClientRect();
      if (rect.bottom < 0 || rect.top > window.innerHeight) return;

      const width = rect.right - rect.left;
      const height = rect.bottom - rect.top;
      const left = rect.left;
      const bottom = window.innerHeight - rect.bottom;

      renderer.setViewport(left, bottom, width, height);
      renderer.setScissor(left, bottom, width, height);
      renderer.setScissorTest(true);

      const portalScene = portalScenes[i];
      const portalObj = portalScene.userData.obj;
      portalObj.rotation.y = t * 0.4;
      portalObj.rotation.x = Math.sin(t * 0.2) * 0.1;
      
      if (i === activeIndex) portalObj.scale.setScalar(1 + Math.sin(t * 1.5) * 0.05);

      renderer.render(portalScene, hangarCamera);
    });
  }

  updateSlider();
  animate();

  window.addEventListener('resize', () => {
    hangarCamera.aspect = window.innerWidth / window.innerHeight;
    hangarCamera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
