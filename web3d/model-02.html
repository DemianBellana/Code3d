<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QUANTUM CORP // OMEGA.02</title>
<style>
  body { margin:0; overflow:hidden; background:#000; cursor:none; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .text { font-family:'Courier New', monospace; font-size:10px; letter-spacing:10px; color:rgba(255,255,255,0.3); text-transform:uppercase; mix-blend-mode:screen; }
  .back { position:absolute; bottom:40px; padding:10px 30px; border:1px solid rgba(255,255,255,0.1); color:#fff; text-decoration:none; font-family:monospace; font-size:10px; letter-spacing:5px; pointer-events:all; transition:all 0.3s; background:rgba(255,255,255,0.02); backdrop-filter:blur(10px); }
  .back:hover { background:#fff; color:#000; letter-spacing:8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="text" id="t1">QUANTUM ANOMALY DETECTED</div>
  <a href="../web3d.html" class="back">SEVER CONNECTION</a>
</div>
<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
  const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:false, powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
  const scene = new THREE.Scene(); const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const geo = new THREE.PlaneGeometry(2, 2);
  const mat = new THREE.ShaderMaterial({
    uniforms: { u_time: {value:0}, u_res: {value:new THREE.Vector2(innerWidth, innerHeight)}, u_mouse: {value:new THREE.Vector2(0,0)} },
    vertexShader: `void main(){ gl_Position = vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float u_time; uniform vec2 u_res; uniform vec2 u_mouse;
      mat2 rot(float a){ float s=sin(a),c=cos(a); return mat2(c,-s,s,c); }
      float sdBox(vec3 p, vec3 b){ vec3 q = abs(p) - b; return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0); }
      float map(vec3 p){
        p.xy *= rot(u_time*0.2 + u_mouse.x*2.0); p.yz *= rot(u_time*0.3 + u_mouse.y*2.0);
        float d = sdBox(p, vec3(1.0));
        p = mod(p, 0.5) - 0.25;
        d = max(d, -sdBox(p, vec3(0.3, 10.0, 0.3))); d = max(d, -sdBox(p, vec3(10.0, 0.3, 0.3))); d = max(d, -sdBox(p, vec3(0.3, 0.3, 10.0)));
        return d;
      }
      void main(){
        vec2 uv = (gl_FragCoord.xy - 0.5*u_res.xy)/u_res.y;
        vec3 ro = vec3(0,0,-4), rd = normalize(vec3(uv, 1.0));
        float t = 0.0; vec3 col = vec3(0);
        for(int i=0; i<80; i++){
          vec3 p = ro + rd*t; float d = map(p);
          if(d<0.001){
            float g = float(i)/80.0;
            col = mix(vec3(0.0,0.8,1.0), vec3(1.0,1.0,1.0), g*2.0) * exp(-t*0.5);
            break;
          }
          t += d;
        }
        col += vec3(0.0, 0.2, 0.3) * exp(-t*0.2); // Glow
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(geo, mat));
  let mx=0, my=0; window.addEventListener('mousemove', e=>{ mx=e.clientX/innerWidth-0.5; my=-(e.clientY/innerHeight-0.5); });
  window.addEventListener('resize', ()=>{ renderer.setSize(innerWidth, innerHeight); mat.uniforms.u_res.value.set(innerWidth,innerHeight); });
  function anim(t){
    requestAnimationFrame(anim);
    mat.uniforms.u_time.value = t*0.001;
    mat.uniforms.u_mouse.value.x += (mx - mat.uniforms.u_mouse.value.x)*0.05;
    mat.uniforms.u_mouse.value.y += (my - mat.uniforms.u_mouse.value.y)*0.05;
    renderer.render(scene, camera);
  } anim(0);
</script>
</body>
</html>
