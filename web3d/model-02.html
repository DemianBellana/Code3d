<!DOCTYPE html>
<html lang="es" class="layout-sidebar">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CORPORATE CORE // OMEGA.02</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@200;400;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web3d/3d-style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="vignette"></div>
<div id="cur"></div>
<canvas id="c"></canvas>
<div id="hud">
  <header><div class="tag">ID // CORE_SECTOR_02</div></header>
  <div class="scene-info glass-panel">
    <span class="tag" style="margin-bottom:1rem; display:block">MODULE 02</span>
    <h1 class="title">CORPORATE<br>CORE</h1>
    <p class="desc">La arquitectura fría de la IA. Procesamiento de protocolos de alto nivel en un entorno de orden absoluto.</p>
  </div>
  <footer><a href="../web3d.html" class="btn-back">RETURN TO HUB</a></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script type="module">
  import * as THREE from 'three';
  window.THREE = THREE;
</script>
<script type="module">
  import { VisualUpgrader } from '/web3d/visual-upgrader.js';
  const s = new THREE.Scene(); s.fog = new THREE.FogExp2(0x03040a, 0.05);
  const c = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 1000); 
  const initialZ = 25;
  c.position.z = initialZ;
  const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight);
  
  const vu = new VisualUpgrader(r, s, c);

  // Crystal DNA
  const quantumMat = new THREE.MeshPhysicalMaterial({ color:0xffffff, metalness:0.1, roughness:0.01, transmission:1, thickness:3, ior:1.45, transparent:true, opacity:0.9 });
  const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(6, 4), quantumMat); s.add(mesh);
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(3, 1), new THREE.MeshBasicMaterial({color:0xffffff, wireframe:true, transparent:true, opacity:0.15}));
  mesh.add(core);

  // Unified Particles
  const pCount = 8000; const pPos = new Float32Array(pCount*3);
  for(let i=0;i<pCount;i++){ pPos[i*3]=(Math.random()-0.5)*100; pPos[i*3+1]=(Math.random()-0.5)*100; pPos[i*3+2]=(Math.random()-0.5)*100; }
  const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const pMat = new THREE.PointsMaterial({color:0xffffff, size:0.06, transparent:true, opacity:0.4, blending:THREE.AdditiveBlending});
  const particles = new THREE.Points(pGeo, pMat); s.add(particles);

  const l1 = new THREE.PointLight(0xffffff, 3, 100); l1.position.set(20, 20, 20); s.add(l1);
  const l2 = new THREE.AmbientLight(0xffffff, 0.2); s.add(l2);

  let mx=0, my=0; 
  window.addEventListener('mousemove', e=>{
    mx=(e.clientX/innerWidth-0.5)*2; my=-(e.clientY/innerHeight-0.5)*2;
    gsap.to('#cur', {x:e.clientX, y:e.clientY, duration:0.1});
  });

  // Mobile Camera Logic (HonkFlow: CA-002, DA-002)
  function updateCam() {
    c.aspect = window.innerWidth / window.innerHeight;
    c.position.z = initialZ * (c.aspect < 1 ? 1.6 : 1);
    c.updateProjectionMatrix();
    r.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', updateCam);
  updateCam();

  function anim(t){
    requestAnimationFrame(anim);
    const time = t*0.001;
    mesh.rotation.y = time*0.1; core.rotation.y = -time*0.2;
    particles.rotation.y = time*0.05;
    c.position.x += (mx*4 - c.position.x)*0.05; c.position.y += (my*4 - c.position.y)*0.05; c.lookAt(0,0,0);
    vu.render(time);
  } anim(0);
</script>
</body>
</html>
