<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QUANTUM CORP // OMEGA.02</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; background:#f0f2f5; color:#050505; font-family:'Inter', sans-serif; overflow:hidden; cursor:crosshair; }
  canvas { position:fixed; inset:0; z-index:0; }
  #ui { position:relative; z-index:10; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  .logo { position:absolute; top:3rem; left:3rem; font-size:0.7rem; font-weight:700; letter-spacing:0.4em; }
  .title { font-size:clamp(3rem, 8vw, 8rem); font-weight:200; letter-spacing:-0.04em; mix-blend-mode:difference; color:#fff; text-align:center; line-height:1; }
  .subtitle { margin-top:1rem; font-size:0.8rem; letter-spacing:0.3em; text-transform:uppercase; color:rgba(0,0,0,0.4); mix-blend-mode:difference; color:#fff; }
  .btn { pointer-events:all; margin-top:4rem; padding:1rem 3rem; background:transparent; border:1px solid #050505; color:#050505; text-decoration:none; font-size:0.7rem; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; transition:all 0.4s; mix-blend-mode:difference; border-color:#fff; color:#fff; }
  .btn:hover { background:#fff; color:#000; padding:1rem 4rem; }
  @media(max-width:768px){ .logo{top:1.5rem;left:1.5rem;} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="logo">QUANTUM_SYS</div>
  <h1 class="title">ABSOLUTE<br>CLARITY</h1>
  <div class="subtitle">Next Generation Corporate Architecture</div>
  <a href="../web3d.html" class="btn">RETURN TO HUB</a>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const s = new THREE.Scene(); s.fog = new THREE.Fog(0xf0f2f5, 10, 50);
  const c = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100); c.position.z = 20;
  const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true, alpha:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); r.setSize(innerWidth, innerHeight);
  
  // High-end glass material
  const geo = new THREE.IcosahedronGeometry(5, 2);
  const mat = new THREE.MeshPhysicalMaterial({ transmission:1, opacity:1, metalness:0.1, roughness:0.05, ior:1.5, thickness:2.5, specularIntensity:1, clearcoat:1, clearcoatRoughness:0.1, color:0xffffff });
  const mesh = new THREE.Mesh(geo, mat); s.add(mesh);
  
  const innerGeo = new THREE.IcosahedronGeometry(2, 1);
  const innerMat = new THREE.MeshStandardMaterial({color:0x00ffe0, wireframe:true});
  const innerMesh = new THREE.Mesh(innerGeo, innerMat); mesh.add(innerMesh);

  const l1 = new THREE.PointLight(0xffffff, 2, 50); l1.position.set(10,10,10); s.add(l1);
  const l2 = new THREE.PointLight(0x00ffe0, 3, 50); l2.position.set(-10,-10,10); s.add(l2);
  const l3 = new THREE.AmbientLight(0xffffff, 0.5); s.add(l3);

  let mx=0, my=0; window.addEventListener('mousemove', e => { mx=(e.clientX/innerWidth-0.5)*2; my=-(e.clientY/innerHeight-0.5)*2; });
  window.addEventListener('resize', () => { c.aspect=innerWidth/innerHeight; c.updateProjectionMatrix(); r.setSize(innerWidth,innerHeight); });

  gsap.from('.title', {y:50, opacity:0, duration:1.5, ease:'power3.out', delay:0.2});
  gsap.from('.btn', {y:20, opacity:0, duration:1, ease:'power3.out', delay:0.6});

  function anim(t) {
    requestAnimationFrame(anim);
    mesh.rotation.y = t * 0.0002; mesh.rotation.x = t * 0.0001;
    innerMesh.rotation.y = -t * 0.0005;
    c.position.x += (mx*5 - c.position.x)*0.05; c.position.y += (my*5 - c.position.y)*0.05; c.lookAt(0,0,0);
    r.render(s, c);
  } anim(0);
</script>
</body>
</html>
