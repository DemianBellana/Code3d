<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ENTRY // SYSTEM_CORE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@200;400;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web3d/3d-style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root { --accent: #ffffff; --bg: #050505; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width: 100%; height: 100%; background:var(--bg); color:#fff; font-family:'Outfit', sans-serif; overflow:hidden; cursor:none; }
  canvas { position:fixed; inset:0; z-index:0; }
  
  #wipe { position:fixed; inset:0; background:var(--bg); z-index:9999; transform-origin:right; transform:scaleX(1); display:flex; align-items:center; justify-content:center; }
  #wipe::after { content:''; position:absolute; width:100%; height:1px; background:#fff; box-shadow:0 0 40px #fff; transform:scaleX(0); animation:scan 1.5s ease-in-out forwards; }
  @keyframes scan { 0%{transform:scaleX(0);} 50%{transform:scaleX(1);} 100%{transform:scaleX(0); opacity:0;} }

  #cur { position: fixed; width: 6px; height: 6px; background: #fff; border-radius: 50%; pointer-events: none; z-index: 10000; transform: translate(-50%,-50%); mix-blend-mode: difference; }
  #cur-ring { position: fixed; width: 44px; height: 44px; border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); transition: width 0.4s, height 0.4s; }
  
  .vignette { position:fixed; inset:0; background:radial-gradient(circle at 50% 50%, transparent 20%, #000 150%); z-index:2; pointer-events:none; }
  .scanlines { position:fixed; inset:0; background:linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.3) 50%); background-size:100% 4px; z-index:3; pointer-events:none; opacity: 0.1; }

  #hud { position:fixed; inset:0; z-index:10; pointer-events:none; padding:4vw; display:flex; flex-direction:column; justify-content:space-between; }
  .header-nav { display: flex; justify-content: space-between; align-items: flex-start; pointer-events: all; }
  
  .scene-info { max-width: 600px; margin-top: 15vh; }
  .tag-line { font-family:'DM Mono', monospace; font-size:10px; letter-spacing:6px; color:#fff; text-transform:uppercase; margin-bottom:1.5rem; opacity:0.6; }
  .main-title { font-family:'Orbitron', sans-serif; font-size:clamp(3.5rem, 10vw, 8rem); font-weight:900; line-height:0.85; letter-spacing:-0.04em; text-transform:uppercase; margin-bottom:2rem; }
  .sub-desc { font-size:1.1rem; font-weight:300; line-height:1.6; color:rgba(255,255,255,0.7); max-width:500px; margin-bottom:2.5rem; }
  
  .footer-meta { display: flex; justify-content: space-between; align-items: flex-end; }
  .layer-info { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 4px; opacity: 0.5; text-transform: uppercase; }

  @media(max-width:768px) { 
    #hud { padding:2rem; } 
    .scene-info { margin-top: 10vh; }
    .main-title { font-size: 4rem; }
  }
</style>
</head>
<body>
<div id="wipe"></div><div class="vignette"></div><div class="scanlines"></div>
<div id="cur"></div><div id="cur-ring"></div>
<canvas id="c"></canvas>

<div id="hud">
  <div class="header-nav">
    <a href="/web3d.html" class="btn-back" style="padding:0.6rem 1.8rem; font-size:9px; border-radius:4px;">← HUB</a>
  </div>
  
  <div class="scene-info">
    <span class="tag-line">ACT 02 // CORE</span>
    <h1 class="main-title">SYSTEM_CORE</h1>
    <p class="sub-desc">Arquitectura de procesamiento cuántico estéril. Escalabilidad sin fricción para ecosistemas corporativos de alto rendimiento. Módulos estabilizados y listos para integración.</p>
  </div>

  <div class="footer-meta">
    <div class="layer-info">LAYER 02 / 04</div>
    <a href="/web3d/model-02/page-02.html" class="btn-next" id="nextBtn" style="pointer-events:all; color:#fff; text-decoration:none; font-family:'Orbitron', sans-serif; font-size:10px; letter-spacing:4px; padding:1rem 2.5rem; border:1px solid rgba(255,255,255,0.1); backdrop-filter:blur(20px);">DEEPER</a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script type="module">
  import * as THREE from 'three';
  window.THREE = THREE;
</script>

<script type="module">
  import { VisualUpgrader } from '/web3d/visual-upgrader.js';
  gsap.to('#wipe', {scaleX: 0, duration: 1.5, ease: 'expo.inOut', delay: 0.2});

  let mx=0, my=0;
  window.addEventListener('mousemove', e => {
    mx = (e.clientX / window.innerWidth - 0.5) * 2;
    my = -(e.clientY / window.innerHeight - 0.5) * 2;
    gsap.to('#cur', {x:e.clientX, y:e.clientY, duration:0.1});
    gsap.to('#cur-ring', {x:e.clientX, y:e.clientY, duration:0.4}); 
  });

  const s = new THREE.Scene(); s.fog = new THREE.FogExp2(0x050505, 0.03);
  const c = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000); 
  const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true, alpha:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); r.setSize(innerWidth, innerHeight);

  const vu = new VisualUpgrader(r, s, c);
  window.vu = vu; 

  // LUCES MAESTRAS
  const l1 = new THREE.PointLight(0xffffff, 50, 100); l1.position.set(20, 20, 20); s.add(l1);
  const l2 = new THREE.PointLight(0xffffff, 30, 100); l2.position.set(-20, -20, 20); s.add(l2);
  s.add(new THREE.AmbientLight(0xffffff, 0.2));

  // OBJETO: FROSTED CRYSTAL CORE
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    metalness: 0.1,
    roughness: 0.2,
    transmission: 0.9,
    thickness: 10,
    ior: 1.45,
    clearcoat: 1,
    clearcoatRoughness: 0.1,
    transparent: true,
    opacity: 0.9,
    emissive: 0xffffff,
    emissiveIntensity: 0.1
  });

  const geo = new THREE.IcosahedronGeometry(12, 4);
  const centralObj = new THREE.Mesh(geo, mat);
  s.add(centralObj);

  // PARTICLES (OPTIMIZADAS)
  const pCount = 5000; const pPos = new Float32Array(pCount*3);
  for(let i=0;i<pCount;i++){ pPos[i*3]=(Math.random()-0.5)*150; pPos[i*3+1]=(Math.random()-0.5)*150; pPos[i*3+2]=(Math.random()-0.5)*150; }
  const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const pMat = new THREE.PointsMaterial({color:0xffffff, size:0.05, transparent:true, opacity:0.3, blending:THREE.AdditiveBlending});
  const particles = new THREE.Points(pGeo, pMat); s.add(particles);

  function updateLayout() {
    const aspect = window.innerWidth / window.innerHeight;
    c.aspect = aspect;
    c.updateProjectionMatrix();
    r.setSize(window.innerWidth, window.innerHeight);

    if(aspect > 1) {
      centralObj.position.set(8, 0, 0);
      c.position.z = 40;
    } else {
      centralObj.position.set(0, 5, -10);
      c.position.z = 50;
    }
  }
  window.addEventListener('resize', updateLayout);
  updateLayout();

  const clock = new THREE.Clock();
  function anim() { 
    requestAnimationFrame(anim); const t = clock.getElapsedTime();
    centralObj.rotation.y = t * 0.1;
    particles.rotation.y = t * 0.02;

    c.position.x += (mx * 4 - c.position.x) * 0.05;
    c.position.y += (my * 4 - c.position.y) * 0.05;
    c.lookAt(centralObj.position);
    
    vu.render(t);
  } 
  anim();
</script>
</body>
</html>
