<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TELEMETRY // OMEGA SYS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --c: #ffffff;
    --bg: #03040a;
    --green: #6dffaa;
    --mono: 'Space Mono', monospace;
    --display: 'Orbitron', sans-serif;
    --body: 'Outfit', sans-serif;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:var(--bg); color:#fff; font-family:var(--body); overflow:hidden; cursor:none; -webkit-font-smoothing:antialiased; }
  canvas { position:fixed; inset:0; z-index:0; }
  .vignette { position:fixed; inset:0; background:radial-gradient(ellipse 85% 85% at 50% 50%, transparent 20%, rgba(0,0,0,0.85) 100%); z-index:2; pointer-events:none; }
  .scanlines { position:fixed; inset:0; background:repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,0,0,0.12) 3px, rgba(0,0,0,0.12) 4px); z-index:3; pointer-events:none; opacity:0.35; }
  .grain { position:fixed; inset:0; z-index:4; pointer-events:none; opacity:0.03; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E"); }

  #wipe { position:fixed; inset:0; background:var(--bg); z-index:9999; transform-origin:right; transform:scaleX(1); }
  #wipe-line { position:absolute; left:0; right:0; top:50%; height:1px; background:#fff; box-shadow:0 0 30px rgba(255,255,255,0.8); transform:scaleX(0); transform-origin:left; animation:wipe-scan 1.6s var(--ease-out) forwards; }
  @keyframes wipe-scan { 0%{transform:scaleX(0);opacity:1;} 60%{transform:scaleX(1);opacity:1;} 100%{transform:scaleX(1);opacity:0;} }

  #cur { position:fixed; width:5px; height:5px; background:#fff; border-radius:50%; pointer-events:none; z-index:10001; transform:translate(-50%,-50%); }
  #cur-ring { position:fixed; width:36px; height:36px; border:1px solid rgba(255,255,255,0.35); border-radius:50%; pointer-events:none; z-index:10000; transform:translate(-50%,-50%); transition:width 0.4s var(--ease-out), height 0.4s var(--ease-out), border-color 0.3s; }

  /* LAYOUT */
  #hud {
    position:fixed; inset:0; z-index:10;
    pointer-events:none;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:clamp(1.5rem, 4vw, 3rem);
  }

  /* TOP */
  .nav-top {
    display:flex; justify-content:space-between; align-items:center;
    pointer-events:all;
    opacity:0;
    animation:fade-up 0.7s var(--ease-out) 1.8s forwards;
  }
  .sys-id { font-family:var(--mono); font-size:9px; letter-spacing:4px; color:rgba(255,255,255,0.3); text-transform:uppercase; }
  .sys-id em { color:var(--green); font-style:normal; }
  .btn-ghost {
    font-family:var(--mono); font-size:9px; letter-spacing:3px; text-transform:uppercase;
    color:rgba(255,255,255,0.4); text-decoration:none;
    padding:7px 15px; border:1px solid rgba(255,255,255,0.1); border-radius:3px;
    backdrop-filter:blur(12px);
    transition:color 0.25s, border-color 0.25s, background 0.25s;
  }
  .btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,0.5); background:rgba(255,255,255,0.05); }

  /* CONTENT — RIGHT PANEL */
  .content-wrap {
    display:flex;
    align-items:center;
    justify-content:flex-end;
    opacity:0;
    animation:fade-up 0.9s var(--ease-out) 2s forwards;
  }

  .telemetry-panel {
    width:320px;
    background:rgba(3,4,10,0.75);
    backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:6px;
    overflow:hidden;
  }

  /* PANEL HEADER */
  .panel-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
    border-bottom:1px solid rgba(255,255,255,0.06);
    background:rgba(255,255,255,0.02);
  }
  .panel-title { font-family:var(--display); font-size:11px; letter-spacing:3px; color:#fff; }
  .live-badge {
    display:flex; align-items:center; gap:5px;
    font-family:var(--mono); font-size:7px; letter-spacing:2px;
    color:var(--green); text-transform:uppercase;
  }
  .live-dot { width:5px; height:5px; border-radius:50%; background:var(--green); animation:live-blink 1.5s ease-in-out infinite; }
  @keyframes live-blink { 0%,100%{opacity:1;box-shadow:0 0 6px var(--green);} 50%{opacity:0.4;box-shadow:none;} }

  /* METRICS GRID */
  .metrics {
    display:grid; grid-template-columns:1fr 1fr 1fr;
    gap:1px; background:rgba(255,255,255,0.05);
    margin:0; padding:0;
  }
  .metric {
    padding:14px 12px;
    background:rgba(3,4,10,0.9);
    text-align:center;
  }
  .metric-label { font-family:var(--mono); font-size:7px; letter-spacing:3px; color:rgba(255,255,255,0.25); text-transform:uppercase; margin-bottom:6px; }
  .metric-val { font-family:var(--mono); font-size:15px; color:#fff; letter-spacing:0; }
  .metric-val.ok { color:var(--green); }
  .metric-val.num { font-size:13px; }
  .metric-unit { font-family:var(--mono); font-size:7px; color:rgba(255,255,255,0.3); margin-top:2px; }

  /* WAVEFORM */
  .waveform-row {
    padding:14px 16px 10px;
    border-top:1px solid rgba(255,255,255,0.05);
  }
  .wf-label { font-family:var(--mono); font-size:7px; letter-spacing:3px; color:rgba(255,255,255,0.25); text-transform:uppercase; margin-bottom:8px; }
  .waveform { width:100%; height:32px; position:relative; overflow:hidden; }
  .waveform canvas { width:100%; height:100%; }

  /* PIPELINE */
  .pipeline {
    padding:14px 16px;
    border-top:1px solid rgba(255,255,255,0.05);
  }
  .pipe-header { font-family:var(--mono); font-size:7px; letter-spacing:4px; color:rgba(255,255,255,0.25); text-transform:uppercase; margin-bottom:12px; display:flex; justify-content:space-between; }
  .pipe-header em { color:var(--green); font-style:normal; }
  .pipe-steps { display:flex; flex-direction:column; gap:1px; }
  .pipe-step {
    display:flex; align-items:center; gap:10px;
    padding:7px 10px;
    border-radius:3px;
    font-family:var(--mono); font-size:8px; letter-spacing:2px; text-transform:uppercase;
    color:rgba(255,255,255,0.2);
    transition:all 0.3s;
    position:relative;
  }
  .pipe-step.done { color:rgba(255,255,255,0.4); }
  .pipe-step.active {
    color:#fff;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
  }
  .pipe-step .step-dot {
    width:5px; height:5px; border-radius:50%; flex-shrink:0;
    background:rgba(255,255,255,0.15);
    transition:background 0.3s;
  }
  .pipe-step.done .step-dot { background:rgba(255,255,255,0.4); }
  .pipe-step.active .step-dot { background:var(--green); box-shadow:0 0 8px var(--green); animation:live-blink 1.5s ease-in-out infinite; }
  .pipe-step .step-idx { font-size:7px; color:rgba(255,255,255,0.15); margin-left:auto; }
  .pipe-step.done .step-idx { color:rgba(255,255,255,0.25); }
  .pipe-step.active .step-idx { color:var(--green); }

  /* BOTTOM */
  .nav-bottom {
    display:flex; justify-content:space-between; align-items:flex-end;
    pointer-events:all;
    opacity:0;
    animation:fade-up 0.7s var(--ease-out) 2.5s forwards;
  }
  .layer-info { font-family:var(--mono); font-size:9px; letter-spacing:4px; color:rgba(255,255,255,0.3); text-transform:uppercase; line-height:1.8; }
  .layer-info strong { color:rgba(255,255,255,0.65); font-weight:400; }
  .progress-bar { margin-top:8px; display:flex; gap:4px; }
  .pb-seg { height:2px; width:22px; background:rgba(255,255,255,0.12); border-radius:2px; }
  .pb-seg.done { background:rgba(255,255,255,0.5); }
  .pb-seg.active { background:#fff; }
  .btn-next {
    display:flex; align-items:center; gap:10px;
    color:#fff; text-decoration:none;
    font-family:var(--display); font-size:9px; letter-spacing:5px; text-transform:uppercase;
    padding:1rem 2rem;
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.02);
    border-radius:3px;
    transition:background 0.35s, border-color 0.35s, box-shadow 0.35s, padding-right 0.35s;
  }
  .btn-next:hover { border-color:rgba(255,255,255,0.5); box-shadow:0 0 35px rgba(255,255,255,0.08); padding-right:2.8rem; }
  .btn-next .arr { transition:transform 0.3s var(--ease-out); }
  .btn-next:hover .arr { transform:translateX(5px); }

  .cold-power {
    position:fixed; bottom:clamp(1.5rem,4vw,3rem); left:clamp(1.5rem,4vw,3rem);
    font-family:var(--mono); font-size:8px; letter-spacing:10px;
    color:rgba(255,255,255,0.12); text-transform:uppercase;
    z-index:10; pointer-events:none;
    opacity:0;
    animation:fade-up 0.7s var(--ease-out) 3s forwards;
  }

  @keyframes fade-up { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

  @media(max-width:768px) {
    .content-wrap { justify-content:center; align-items:flex-start; padding-top:1rem; }
    .telemetry-panel { width:calc(100vw - 3rem); }
    .layer-info { display:none; }
    .cold-power { display:none; }
    #cur, #cur-ring { display:none; }
  }
</style>
</head>
<body>
<div id="wipe"><div id="wipe-line"></div></div>
<div class="vignette"></div>
<div class="scanlines"></div>
<div class="grain"></div>
<div id="cur"></div>
<div id="cur-ring"></div>
<canvas id="c"></canvas>

<div id="hud">
  <nav class="nav-top">
    <div class="sys-id">// OMEGA_SYS &nbsp;<em>03</em></div>
    <a href="/web3d.html" class="btn-ghost">← HUB</a>
  </nav>

  <div class="content-wrap">
    <div class="telemetry-panel">
      <div class="panel-header">
        <span class="panel-title">TELEMETRY</span>
        <span class="live-badge"><span class="live-dot"></span>LIVE</span>
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="metric-label">STATUS</div>
          <div class="metric-val ok">OPT</div>
          <div class="metric-unit">NOMINAL</div>
        </div>
        <div class="metric">
          <div class="metric-label">LATENCY</div>
          <div class="metric-val num" id="lat-val">0.4</div>
          <div class="metric-unit">ms</div>
        </div>
        <div class="metric">
          <div class="metric-label">NODES</div>
          <div class="metric-val ok">SYN</div>
          <div class="metric-unit">SYNCED</div>
        </div>
      </div>

      <div class="waveform-row">
        <div class="wf-label">SIGNAL // CORE_OUTPUT</div>
        <div class="waveform"><canvas id="wf"></canvas></div>
      </div>

      <div class="pipeline">
        <div class="pipe-header">SDD_PIPELINE <em>// HONKFLOW</em></div>
        <div class="pipe-steps" id="pipeline-steps">
          <div class="pipe-step done"><span class="step-dot"></span>EXPLORE<span class="step-idx">01</span></div>
          <div class="pipe-step done"><span class="step-dot"></span>PROPOSE<span class="step-idx">02</span></div>
          <div class="pipe-step done"><span class="step-dot"></span>SPEC<span class="step-idx">03</span></div>
          <div class="pipe-step done"><span class="step-dot"></span>DESIGN<span class="step-idx">04</span></div>
          <div class="pipe-step active"><span class="step-dot"></span>APPLY<span class="step-idx">05</span></div>
          <div class="pipe-step"><span class="step-dot"></span>VERIFY<span class="step-idx">06</span></div>
          <div class="pipe-step"><span class="step-dot"></span>ARCHIVE<span class="step-idx">07</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="nav-bottom">
    <div class="layer-info">
      LAYER <strong>03 / 04</strong>
      <div class="progress-bar">
        <div class="pb-seg done"></div>
        <div class="pb-seg done"></div>
        <div class="pb-seg active"></div>
        <div class="pb-seg"></div>
      </div>
    </div>
    <a href="/web3d/model-02/page-04.html" class="btn-next" id="nextBtn">
      DEEPER
      <span class="arr">→</span>
    </a>
  </div>
</div>

<div class="cold-power">PODER FRÍO</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script type="x-shader/x-vertex" id="p-vert">
  attribute float size; attribute float phase; varying float vAlpha; uniform float uTime;
  void main() {
    vec3 pos = position; float dist = length(pos);
    float wave = sin(dist * 0.18 - uTime + phase) * 0.5 + 0.5;
    pos += normalize(pos) * wave * 1.5;
    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
    gl_PointSize = size * (280.0 / -mv.z) * (0.4 + wave * 0.6);
    gl_Position = projectionMatrix * mv;
    vAlpha = smoothstep(80.0, 8.0, dist) * (0.15 + wave * 0.5);
  }
</script>
<script type="x-shader/x-fragment" id="p-frag">
  varying float vAlpha; uniform vec3 uColor;
  void main() {
    float d = length(gl_PointCoord - 0.5);
    if(d > 0.5) discard;
    gl_FragColor = vec4(uColor, vAlpha * (1.0 - d * 2.0));
  }
</script>

<script type="module">
  import * as THREE from 'three';

  // CURSOR
  const cur = document.getElementById('cur'), ring = document.getElementById('cur-ring');
  let mx=0, my=0;
  function moveCursor(x,y){ mx=(x/innerWidth-0.5)*2; my=-(y/innerHeight-0.5)*2; gsap.to(cur,{x,y,duration:0.05}); gsap.to(ring,{x,y,duration:0.3}); }
  window.addEventListener('mousemove',e=>moveCursor(e.clientX,e.clientY));
  window.addEventListener('touchmove',e=>moveCursor(e.touches[0].clientX,e.touches[0].clientY));
  document.querySelectorAll('a').forEach(el=>{
    el.addEventListener('mouseenter',()=>gsap.to(ring,{width:56,height:56,borderColor:'rgba(255,255,255,0.7)',duration:0.3}));
    el.addEventListener('mouseleave',()=>gsap.to(ring,{width:36,height:36,borderColor:'rgba(255,255,255,0.35)',duration:0.3}));
  });

  gsap.to('#wipe',{scaleX:0,duration:1.5,ease:'expo.inOut',delay:0.1});
  document.getElementById('nextBtn').addEventListener('click',e=>{ e.preventDefault(); const h=e.currentTarget.href; gsap.to('#wipe',{scaleX:1,duration:1.1,ease:'expo.inOut',transformOrigin:'left',onComplete:()=>location.href=h}); });

  // WAVEFORM CANVAS
  const wfCanvas = document.getElementById('wf');
  const wfCtx = wfCanvas.getContext('2d');
  function resizeWf(){ wfCanvas.width=wfCanvas.offsetWidth; wfCanvas.height=wfCanvas.offsetHeight; }
  resizeWf();
  let wfT = 0;
  function drawWaveform(){
    const w=wfCanvas.width, h=wfCanvas.height;
    wfCtx.clearRect(0,0,w,h);
    wfCtx.strokeStyle='rgba(109,255,170,0.7)';
    wfCtx.lineWidth=1.5;
    wfCtx.shadowColor='#6dffaa'; wfCtx.shadowBlur=6;
    wfCtx.beginPath();
    for(let x=0;x<w;x++){
      const t=x/w*Math.PI*4 + wfT;
      const y=h/2 + Math.sin(t)*h*0.25 + Math.sin(t*2.3+0.5)*h*0.12 + Math.sin(t*5.1+1)*h*0.05;
      x===0?wfCtx.moveTo(x,y):wfCtx.lineTo(x,y);
    }
    wfCtx.stroke();
    wfT += 0.04;
  }

  // LATENCY SCRAMBLE
  let lastLat = 0.4;
  setInterval(()=>{
    const el = document.getElementById('lat-val');
    lastLat = Math.max(0.2, Math.min(0.8, lastLat + (Math.random()-0.5)*0.15));
    el.textContent = lastLat.toFixed(1);
  }, 800);

  // SCENE
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x03040a, 0.035);
  const cam = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
  cam.position.z = 25;
  const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.setSize(innerWidth,innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;

  const N=12000; const pPos=new Float32Array(N*3); const pSiz=new Float32Array(N); const pPhs=new Float32Array(N);
  for(let i=0;i<N;i++){ pPos[i*3]=(Math.random()-0.5)*160; pPos[i*3+1]=(Math.random()-0.5)*160; pPos[i*3+2]=(Math.random()-0.5)*160; pSiz[i]=Math.random()*1.5; pPhs[i]=Math.random()*Math.PI*2; }
  const pGeo=new THREE.BufferGeometry(); pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3)); pGeo.setAttribute('size',new THREE.BufferAttribute(pSiz,1)); pGeo.setAttribute('phase',new THREE.BufferAttribute(pPhs,1));
  const pMat=new THREE.ShaderMaterial({uniforms:{uTime:{value:0},uColor:{value:new THREE.Color(0xffffff)}}, vertexShader:document.getElementById('p-vert').textContent, fragmentShader:document.getElementById('p-frag').textContent, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false});
  scene.add(new THREE.Points(pGeo,pMat));

  const l1=new THREE.PointLight(0xffffff,3,100); l1.position.set(10,15,10); scene.add(l1);
  const l2=new THREE.PointLight(0xaabbff,1.5,80); l2.position.set(-10,-15,10); scene.add(l2);
  scene.add(new THREE.AmbientLight(0xffffff,0.08));

  const coreMat=new THREE.MeshPhysicalMaterial({color:0xffffff,transmission:1,thickness:2.5,roughness:0.04,ior:1.5,clearcoat:1,clearcoatRoughness:0.04});
  const core=new THREE.Mesh(new THREE.IcosahedronGeometry(6,3),coreMat);
  const inner=new THREE.Mesh(new THREE.IcosahedronGeometry(2.8,1),new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:0.2}));
  scene.add(core); scene.add(inner);

  function onResize(){
    const asp=innerWidth/innerHeight; cam.aspect=asp; cam.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
    const tx=asp>1?-4:0;
    core.position.x=tx; inner.position.x=tx;
    cam.position.z=asp>1?25:28;
  }
  window.addEventListener('resize',onResize); onResize();

  const clock=new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const t=clock.getElapsedTime();
    pMat.uniforms.uTime.value=t;
    core.rotation.y=t*0.1; core.rotation.x=Math.sin(t*0.04)*0.1;
    inner.rotation.y=-t*0.22;
    cam.position.x+=(mx*8+core.position.x-cam.position.x)*0.05;
    cam.position.y+=(my*5-cam.position.y)*0.05;
    cam.lookAt(core.position);
    drawWaveform();
    renderer.render(scene,cam);
  }
  animate();
</script>
</body>
</html>
