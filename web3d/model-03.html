<!DOCTYPE html>
<html lang="es" class="layout-central">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CORPORATE CORE // OMEGA.03</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@200;400;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web3d/3d-style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="vignette"></div>
<div id="cur"></div>
<canvas id="c"></canvas>
<div id="hud">
  <header><div class="tag">ID // COSMIC_SECTOR_03</div></header>
  <div class="scene-info glass-panel">
    <h1 class="title">COSMIC<br>LAYER</h1>
    <p class="desc">Horizontes de sucesos y nubes galácticas simuladas en tiempo real.</p>
  </div>
  <footer><a href="../web3d.html" class="btn-back">RETURN TO HUB</a></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script type="module">
  import * as THREE from 'three';
  window.THREE = THREE;
</script>
<script type="module">
  import { VisualUpgrader } from '/web3d/visual-upgrader.js';
  const s = new THREE.Scene();
  const c = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000); 
  const initialZ = 22;
  c.position.z = initialZ;
  const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight);

  const vu = new VisualUpgrader(r, s, c);

  // Galaxy DNA
  const pCount = 15000; const pPos = new Float32Array(pCount*3);
  for(let i=0;i<pCount;i++){
    const r = Math.random()*10 + 2; const a = Math.random()*Math.PI*2;
    pPos[i*3] = Math.cos(a)*r; pPos[i*3+1] = (Math.random()-0.5)*2; pPos[i*3+2] = Math.sin(a)*r;
  }
  const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const pMat = new THREE.PointsMaterial({color:0xa855f7, size:0.05, transparent:true, opacity:0.6, blending:THREE.AdditiveBlending});
  const galaxy = new THREE.Points(pGeo, pMat); s.add(galaxy);

  function updateCam() {
    c.aspect = window.innerWidth / window.innerHeight;
    c.position.z = initialZ * (c.aspect < 1 ? 1.8 : 1);
    c.updateProjectionMatrix();
    r.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', updateCam);
  updateCam();

  function anim(t){
    requestAnimationFrame(anim);
    galaxy.rotation.y = t*0.0002;
    vu.render(t*0.001);
  } anim(0);
</script>
</body>
</html>
