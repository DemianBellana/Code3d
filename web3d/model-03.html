<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COSMIC LAYER // OMEGA.03</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --cyan: #00f0ff; --violet: #a855f7; --white: #ffffff; --bg: #03040a; --glass: rgba(255, 255, 255, 0.02); --border: rgba(255, 255, 255, 0.08); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: #fff; overflow: hidden; font-family: 'Rajdhani', sans-serif; cursor: none; }
  canvas { position: fixed; inset: 0; z-index: 0; }
  #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; padding: 3rem; display: flex; flex-direction: column; justify-content: space-between; }
  .hud-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .hud-tag { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.3em; color: var(--violet); background: rgba(168,85,247,0.05); padding: 0.5rem 1rem; border: 1px solid rgba(168,85,247,0.2); backdrop-filter: blur(10px); }
  .scene-info { position: absolute; top: 50%; left: 8vw; transform: translateY(-50%); max-width: 500px; }
  .scene-num { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; color: var(--violet); letter-spacing: 0.5em; margin-bottom: 1.5rem; display: block; opacity: 0.6; }
  .scene-title { font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 5vw, 4.5rem); font-weight: 900; line-height: 0.9; text-transform: uppercase; margin-bottom: 1.5rem; letter-spacing: -1px; }
  .scene-desc { font-size: 1.1rem; font-weight: 300; line-height: 1.6; color: rgba(255,255,255,0.5); border-left: 2px solid var(--violet); padding-left: 1.5rem; }
  .hud-footer { display: flex; justify-content: space-between; align-items: flex-end; }
  .back-btn { pointer-events: all; text-decoration: none; color: #fff; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; letter-spacing: 0.3em; padding: 1rem 2rem; border: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(20px); border-radius: 4px; transition: all 0.4s; }
  .back-btn:hover { border-color: var(--violet); background: rgba(168,85,247,0.05); }
  #cur { position: fixed; width: 8px; height: 8px; background: #fff; border-radius: 50%; pointer-events: none; z-index: 10000; transform: translate(-50%,-50%); mix-blend-mode: difference; }
  #cur-ring { position: fixed; width: 40px; height: 40px; border: 1px solid rgba(168,85,247,0.3); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); transition: width 0.3s, height 0.3s; }
  .vignette { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, transparent 20%, #000 180%); z-index: 5; pointer-events: none; }
</style>
</head>
<body>
<div class="vignette"></div>
<div id="cur"></div>
<div id="cur-ring"></div>
<canvas id="c"></canvas>
<div id="hud">
  <header class="hud-header"><div class="hud-tag">ID // COSMIC_LAYER_03</div></header>
  <div class="scene-info">
    <span class="scene-num">MODULE 03</span>
    <h1 class="scene-title">COSMIC<br>LAYER</h1>
    <p class="scene-desc">La capa de expansión consciencial. Donde los datos se vuelven nebulosas y la IA contempla la escala del infinito digital.</p>
  </div>
  <footer class="hud-footer"><a href="../web3d.html" class="back-btn">RETURN TO HUB</a></footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const s = new THREE.Scene(); s.fog = new THREE.FogExp2(0x03040a, 0.04);
  const c = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000); c.position.z = 100;
  const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight);

  // Galactic Cloud DNA
  const pCount = 20000; const pPos = new Float32Array(pCount*3); const pCol = new Float32Array(pCount*3);
  for(let i=0;i<pCount;i++){
    const rad = Math.random()*150; const ang = Math.random()*Math.PI*2;
    pPos[i*3] = Math.cos(ang)*rad; pPos[i*3+1] = (Math.random()-0.5)*20; pPos[i*3+2] = Math.sin(ang)*rad;
    const isViolet = Math.random() > 0.5;
    pCol[i*3] = isViolet ? 0.66 : 0; pCol[i*3+1] = isViolet ? 0.33 : 0.85; pCol[i*3+2] = 1;
  }
  const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
  const pMat = new THREE.PointsMaterial({size:0.2, vertexColors:true, transparent:true, opacity:0.6, blending:THREE.AdditiveBlending});
  const galaxy = new THREE.Points(pGeo, pMat); s.add(galaxy);

  const l1 = new THREE.PointLight(0xa855f7, 5, 200); l1.position.set(0, 0, 0); s.add(l1);

  let mx=0, my=0; window.addEventListener('mousemove', e=>{
    mx=(e.clientX/innerWidth-0.5)*2; my=-(e.clientY/innerHeight-0.5)*2;
    gsap.to('#cur', {x:e.clientX, y:e.clientY, duration:0.1}); gsap.to('#cur-ring', {x:e.clientX, y:e.clientY, duration:0.4});
  });
  window.addEventListener('resize', ()=>{ c.aspect=innerWidth/innerHeight; c.updateProjectionMatrix(); r.setSize(innerWidth,innerHeight); });

  function anim(t){
    requestAnimationFrame(anim);
    galaxy.rotation.y = t*0.0001;
    c.position.x += (mx*20 - c.position.x)*0.03; c.position.y += (my*20 - c.position.y)*0.03; c.lookAt(0,0,0);
    r.render(s, c);
  } anim(0);
</script>
</body>
</html>
