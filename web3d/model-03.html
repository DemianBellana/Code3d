<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPACE CINEMATIC // OMEGA.03</title>
<style>
  body { margin:0; overflow:hidden; background:#000; cursor:none; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  .c-bar { position:absolute; left:0; width:100%; height:8vh; background:#000; display:flex; align-items:center; justify-content:center; }
  .top { top:0; } .bot { bottom:0; }
  .text { font-family:'Helvetica Neue', sans-serif; font-size:9px; letter-spacing:15px; color:#fff; text-transform:uppercase; }
  .btn { position:absolute; bottom:10vh; left:50%; transform:translateX(-50%); pointer-events:all; padding:15px 40px; color:#fff; text-decoration:none; font-family:sans-serif; font-size:10px; letter-spacing:4px; border:1px solid rgba(255,255,255,0.2); border-radius:100px; transition:all 0.3s; }
  .btn:hover { background:#fff; color:#000; box-shadow:0 0 30px #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="c-bar top"><div class="text">ACCRETION DISK</div></div>
  <a href="../web3d.html" class="btn">ESCAPE GRAVITY</a>
  <div class="c-bar bot"><div class="text">EVENT HORIZON</div></div>
</div>
<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
  const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
  const scene = new THREE.Scene(); const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const geo = new THREE.PlaneGeometry(2, 2);
  const mat = new THREE.ShaderMaterial({
    uniforms: { u_time: {value:0}, u_res: {value:new THREE.Vector2(innerWidth, innerHeight)}, u_mouse: {value:new THREE.Vector2(0,0)} },
    vertexShader: `void main(){ gl_Position = vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float u_time; uniform vec2 u_res; uniform vec2 u_mouse;
      float noise(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 45.164))) * 43758.5453); }
      void main(){
        vec2 uv = (gl_FragCoord.xy - 0.5*u_res.xy)/u_res.y;
        uv += u_mouse * 0.1;
        float d = length(uv);
        float angle = atan(uv.y, uv.x);
        
        // Gravitational lensing distortion
        float lens = 1.0 / (d + 0.1);
        vec2 distort = vec2(cos(angle), sin(angle)) * lens * 0.05;
        
        // Accretion disk
        float disk = smoothstep(0.1, 0.15, d) * smoothstep(0.8, 0.4, d);
        float swirl = sin(angle * 10.0 + d * 20.0 - u_time * 5.0);
        disk *= (swirl * 0.5 + 0.5);
        
        // Black hole shadow
        float bh = smoothstep(0.15, 0.16, d);
        
        vec3 col = vec3(1.0, 0.5, 0.1) * disk * 2.0;
        col += vec3(0.5, 0.2, 0.8) * noise(vec3(uv*10.0, u_time)) * disk;
        col *= bh;
        
        // Stars background bent by gravity
        float st = noise(vec3((uv + distort)*50.0, 0.0));
        col += vec3(pow(st, 50.0)) * bh;
        
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(geo, mat));
  let mx=0, my=0; window.addEventListener('mousemove', e=>{ mx=e.clientX/innerWidth-0.5; my=-(e.clientY/innerHeight-0.5); });
  window.addEventListener('resize', ()=>{ renderer.setSize(innerWidth, innerHeight); mat.uniforms.u_res.value.set(innerWidth,innerHeight); });
  function anim(t){
    requestAnimationFrame(anim);
    mat.uniforms.u_time.value = t*0.001;
    mat.uniforms.u_mouse.value.x += (mx - mat.uniforms.u_mouse.value.x)*0.05;
    mat.uniforms.u_mouse.value.y += (my - mat.uniforms.u_mouse.value.y)*0.05;
    renderer.render(scene, camera);
  } anim(0);
</script>
</body>
</html>
