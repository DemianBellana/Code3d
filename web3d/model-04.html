<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI OS // OMEGA.04</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; background:#000a14; color:#0088ff; font-family:'DM Mono', monospace; overflow:hidden; }
  canvas { position:fixed; inset:0; z-index:0; }
  .corner { position:fixed; z-index:10; padding:2rem; pointer-events:none; }
  .tl { top:0; left:0; } .tr { top:0; right:0; text-align:right; }
  .bl { bottom:0; left:0; } .br { bottom:0; right:0; pointer-events:all; }
  .data-block { margin-bottom:1rem; }
  .lbl { font-size:0.6rem; color:rgba(0,136,255,0.5); letter-spacing:0.2em; text-transform:uppercase; margin-bottom:0.2rem; }
  .val { font-size:1.2rem; font-weight:500; text-shadow:0 0 10px rgba(0,136,255,0.8); }
  .btn { display:inline-block; padding:1rem 2rem; border:1px solid #0088ff; color:#0088ff; text-decoration:none; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.2em; background:rgba(0,136,255,0.1); backdrop-filter:blur(5px); transition:all 0.3s; }
  .btn:hover { background:#0088ff; color:#000; box-shadow:0 0 30px #0088ff; }
  .center-reticle { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:40vw; height:40vw; max-width:500px; max-height:500px; border:1px solid rgba(0,136,255,0.2); border-radius:50%; z-index:5; pointer-events:none; animation:spin 20s linear infinite; }
  .center-reticle::before, .center-reticle::after { content:''; position:absolute; width:10px; height:10px; border:1px solid #0088ff; }
  .center-reticle::before { top:-5px; left:50%; transform:translateX(-50%); } .center-reticle::after { bottom:-5px; left:50%; transform:translateX(-50%); }
  @keyframes spin { 100% { transform:translate(-50%,-50%) rotate(360deg); } }
  @media(max-width:768px){ .corner{padding:1rem;} .val{font-size:0.9rem;} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="center-reticle"></div>
<div class="corner tl"><div class="data-block"><div class="lbl">SYSTEM</div><div class="val">AI_OS_v4.2.0</div></div><div class="data-block"><div class="lbl">STATUS</div><div class="val">OPTIMAL</div></div></div>
<div class="corner tr"><div class="data-block"><div class="lbl">MEMORY</div><div class="val" id="mem">0TB</div></div><div class="data-block"><div class="lbl">NETWORK</div><div class="val">UPLINK</div></div></div>
<div class="corner bl"><div class="data-block"><div class="lbl">COORDINATES</div><div class="val" id="coord">X:0 Y:0</div></div></div>
<div class="corner br"><a href="../web3d.html" class="btn">DISCONNECT</a></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const s = new THREE.Scene();
  const c = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100); c.position.z = 15;
  const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true, alpha:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); r.setSize(innerWidth, innerHeight);

  const rings = [];
  const mat = new THREE.MeshBasicMaterial({color:0x0088ff, wireframe:true, transparent:true, opacity:0.3});
  for(let i=0; i<5; i++){
    const geo = new THREE.TorusGeometry(3 + i*1.2, 0.05, 8, 50);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = Math.random()*Math.PI; mesh.rotation.y = Math.random()*Math.PI;
    mesh.userData = { rx:(Math.random()-0.5)*0.02, ry:(Math.random()-0.5)*0.02 };
    s.add(mesh); rings.push(mesh);
  }

  // Data stream
  const pg = new THREE.BufferGeometry(); const pa = new Float32Array(500*3);
  for(let i=0;i<500;i++){ pa[i*3]=(Math.random()-0.5)*2; pa[i*3+1]=(Math.random()-0.5)*20; pa[i*3+2]=(Math.random()-0.5)*2; }
  pg.setAttribute('position', new THREE.BufferAttribute(pa,3));
  const pm = new THREE.PointsMaterial({color:0x00ffff, size:0.05, transparent:true, opacity:0.8});
  const stream = new THREE.Points(pg, pm); s.add(stream);

  let mx=0, my=0; window.addEventListener('mousemove', e => { 
    mx=(e.clientX/innerWidth-0.5)*2; my=-(e.clientY/innerHeight-0.5)*2; 
    document.getElementById('coord').innerText = `X:${(mx*100).toFixed(1)} Y:${(my*100).toFixed(1)}`;
  });
  window.addEventListener('resize', () => { c.aspect=innerWidth/innerHeight; c.updateProjectionMatrix(); r.setSize(innerWidth,innerHeight); });

  function anim() {
    requestAnimationFrame(anim);
    rings.forEach(r => { r.rotation.x += r.userData.rx; r.rotation.y += r.userData.ry; });
    const pos = pg.attributes.position.array;
    for(let i=0; i<500; i++){ pos[i*3+1] += 0.1; if(pos[i*3+1] > 10) pos[i*3+1] = -10; }
    pg.attributes.position.needsUpdate = true;
    c.position.x += (mx*2 - c.position.x)*0.05; c.position.y += (my*2 - c.position.y)*0.05; c.lookAt(0,0,0);
    document.getElementById('mem').innerText = (Math.random()*10+90).toFixed(2)+'TB';
    r.render(s, c);
  } anim();
</script>
</body>
</html>
