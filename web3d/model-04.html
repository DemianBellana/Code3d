<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI OS // OMEGA.04</title>
<style>
  body { margin:0; overflow:hidden; background:#000a14; color:#fff; font-family:monospace; cursor:crosshair; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; padding:2vw; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
  .panel { border:1px solid rgba(0,136,255,0.3); background:rgba(0,136,255,0.02); padding:20px; backdrop-filter:blur(5px); }
  .tl { grid-column:1; grid-row:1; align-self:start; justify-self:start; }
  .tr { grid-column:2; grid-row:1; align-self:start; justify-self:end; text-align:right; }
  .bl { grid-column:1; grid-row:2; align-self:end; justify-self:start; }
  .br { grid-column:2; grid-row:2; align-self:end; justify-self:end; pointer-events:all; }
  h1 { font-size:12px; letter-spacing:4px; color:#0088ff; margin:0 0 10px 0; }
  p { font-size:10px; color:rgba(255,255,255,0.5); margin:0; line-height:1.5; }
  .btn { display:inline-block; padding:10px 20px; background:#0088ff; color:#000; text-decoration:none; font-weight:bold; letter-spacing:2px; font-size:10px; transition:0.3s; }
  .btn:hover { background:#fff; box-shadow:0 0 20px #0088ff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="panel tl"><h1>SYNAPSE</h1><p id="data1">CALCULATING...</p></div>
  <div class="panel tr"><h1>NETWORK</h1><p id="data2">ALIVE</p></div>
  <div class="panel bl"><h1>LOG</h1><p id="data3">STREAMING...</p></div>
  <div class="br"><a href="../web3d.html" class="btn">DEACTIVATE</a></div>
</div>
<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
  const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
  const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x000a14, 5, 25);
  const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100); camera.position.z = 12;
  
  // Neural Network Nodes & Lines
  const count = 300; const nodesGeo = new THREE.BufferGeometry(); const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){ pos[i*3]=(Math.random()-0.5)*20; pos[i*3+1]=(Math.random()-0.5)*20; pos[i*3+2]=(Math.random()-0.5)*15; }
  nodesGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const nodes = new THREE.Points(nodesGeo, new THREE.PointsMaterial({color:0x00ffff, size:0.1})); scene.add(nodes);
  
  const linesMat = new THREE.LineBasicMaterial({color:0x0088ff, transparent:true, opacity:0.15});
  const linesGeo = new THREE.BufferGeometry();
  const index = [];
  for(let i=0;i<count;i++){
    for(let j=i+1;j<count;j++){
      const dx=pos[i*3]-pos[j*3], dy=pos[i*3+1]-pos[j*3+1], dz=pos[i*3+2]-pos[j*3+2];
      if(dx*dx+dy*dy+dz*dz < 15) { index.push(i, j); }
    }
  }
  linesGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  linesGeo.setIndex(index);
  const lines = new THREE.LineSegments(linesGeo, linesMat); scene.add(lines);

  let mx=0, my=0; window.addEventListener('mousemove', e=>{ mx=e.clientX/innerWidth-0.5; my=-(e.clientY/innerHeight-0.5); document.getElementById('data1').innerText=e.clientX; });
  window.addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

  function anim(t){
    requestAnimationFrame(anim);
    const time = t*0.0005;
    nodes.rotation.y = time; lines.rotation.y = time;
    nodes.rotation.z = time*0.5; lines.rotation.z = time*0.5;
    camera.position.x += (mx*10 - camera.position.x)*0.05;
    camera.position.y += (my*10 - camera.position.y)*0.05;
    camera.lookAt(0,0,0);
    renderer.render(scene, camera);
  } anim(0);
</script>
</body>
</html>
