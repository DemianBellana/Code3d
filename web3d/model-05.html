<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DIGITAL LUXURY // OMEGA.05</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; background:#030303; color:#c8a97a; font-family:'Playfair Display', serif; overflow:hidden; }
  canvas { position:fixed; inset:0; z-index:0; }
  #ui { position:absolute; right:8vw; top:50%; transform:translateY(-50%); text-align:right; z-index:10; pointer-events:none; }
  .eyebrow { font-family:'Inter', sans-serif; font-size:0.7rem; letter-spacing:0.4em; text-transform:uppercase; margin-bottom:1.5rem; color:rgba(200,169,122,0.6); }
  .title { font-size:clamp(4rem, 10vw, 8rem); font-weight:400; line-height:1; margin:0; text-shadow:0 10px 30px rgba(0,0,0,0.8); }
  .title i { font-style:italic; font-weight:700; }
  .btn { display:inline-block; pointer-events:all; margin-top:3rem; padding:1.2rem 3rem; border:1px solid rgba(200,169,122,0.3); color:#c8a97a; text-decoration:none; font-family:'Inter', sans-serif; font-size:0.7rem; letter-spacing:0.3em; text-transform:uppercase; transition:all 0.5s; background:rgba(0,0,0,0.3); backdrop-filter:blur(10px); }
  .btn:hover { background:#c8a97a; color:#000; box-shadow:0 0 30px rgba(200,169,122,0.4); }
  @media(max-width:768px){ #ui{right:auto; left:50%; transform:translate(-50%,-50%); text-align:center;} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="eyebrow">The Pinnacle of Digital Art</div>
  <h1 class="title">Pure<br><i>Luxury</i></h1>
  <a href="../web3d.html" class="btn">Return to Gallery</a>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const s = new THREE.Scene(); s.fog = new THREE.Fog(0x030303, 10, 30);
  const c = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100); c.position.set(0,0,15);
  const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); r.setSize(innerWidth, innerHeight);
  r.toneMapping = THREE.ACESFilmicToneMapping;

  // Liquid Gold Sphere
  const geo = new THREE.SphereGeometry(4, 128, 128);
  const mat = new THREE.MeshStandardMaterial({ color:0xc8a97a, metalness:1, roughness:0.15 });
  const mesh = new THREE.Mesh(geo, mat);
  if(innerWidth>768) mesh.position.x = -4; // Offset for desktop
  s.add(mesh);

  // Lights for reflections
  const l1 = new THREE.DirectionalLight(0xffffff, 2); l1.position.set(5,10,7); s.add(l1);
  const l2 = new THREE.DirectionalLight(0xc8a97a, 1.5); l2.position.set(-5,-5,5); s.add(l2);
  const l3 = new THREE.AmbientLight(0x222222); s.add(l3);

  // Environment for metalness (simple approach)
  const pmremGenerator = new THREE.PMREMGenerator(r);
  s.environment = pmremGenerator.fromScene(new THREE.Scene()).texture; // Hacky ambient reflections

  let mx=0, my=0; window.addEventListener('mousemove', e => { mx=(e.clientX/innerWidth-0.5)*2; my=-(e.clientY/innerHeight-0.5)*2; });
  window.addEventListener('resize', () => { c.aspect=innerWidth/innerHeight; c.updateProjectionMatrix(); r.setSize(innerWidth,innerHeight); if(innerWidth>768) mesh.position.x=-4; else mesh.position.x=0; });

  gsap.from('.eyebrow', {y:20, opacity:0, duration:1.5, delay:0.2});
  gsap.from('.title', {y:30, opacity:0, duration:1.5, delay:0.4});
  gsap.from('.btn', {y:20, opacity:0, duration:1.5, delay:0.6});

  const origPos = geo.attributes.position.clone();
  function anim(t) {
    requestAnimationFrame(anim);
    const time = t * 0.001;
    // Vertex displacement for liquid effect
    const pos = geo.attributes.position;
    for(let i=0; i<pos.count; i++){
      const v = new THREE.Vector3().fromBufferAttribute(origPos, i);
      const noise = Math.sin(v.x*2 + time) * Math.cos(v.y*2 + time) * Math.sin(v.z*2 + time);
      v.multiplyScalar(1 + noise * 0.05);
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    pos.needsUpdate = true;
    geo.computeVertexNormals(); // Crucial for lighting to look right on displaced vertices

    mesh.rotation.y = time * 0.2;
    mesh.rotation.x = time * 0.1;
    
    c.position.x += (mx*2 - c.position.x)*0.05; c.position.y += (my*2 - c.position.y)*0.05; c.lookAt(mesh.position);
    r.render(s, c);
  } anim(0);
</script>
</body>
</html>
