<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEURAL CHAMBER // OMEGA.05</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --gold: #c8a97a; --bg: #03040a; --glass: rgba(255, 255, 255, 0.02); --border: rgba(200, 169, 122, 0.2); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: #fff; overflow: hidden; font-family: 'Rajdhani', sans-serif; cursor: none; }
  canvas { position: fixed; inset: 0; z-index: 0; }
  #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; padding: 3rem; display: flex; flex-direction: column; justify-content: space-between; }
  .hud-tag { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.3em; color: var(--gold); background: rgba(200,169,122,0.05); padding: 0.5rem 1rem; border: 1px solid var(--border); backdrop-filter: blur(10px); }
  .scene-info { position: absolute; top: 50%; right: 8vw; transform: translateY(-50%); max-width: 500px; text-align: right; }
  .scene-num { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; color: var(--gold); letter-spacing: 0.5em; margin-bottom: 1.5rem; display: block; opacity: 0.6; }
  .scene-title { font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 5vw, 4.5rem); font-weight: 900; line-height: 0.9; text-transform: uppercase; margin-bottom: 1.5rem; letter-spacing: -1px; }
  .scene-desc { font-size: 1.1rem; font-weight: 300; line-height: 1.6; color: rgba(255,255,255,0.5); border-right: 2px solid var(--gold); padding-right: 1.5rem; }
  .back-btn { pointer-events: all; text-decoration: none; color: #fff; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; letter-spacing: 0.3em; padding: 1rem 2rem; border: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(20px); border-radius: 4px; transition: all 0.4s; }
  .back-btn:hover { border-color: var(--gold); color: var(--gold); }
  #cur { position: fixed; width: 8px; height: 8px; background: var(--gold); border-radius: 50%; pointer-events: none; z-index: 10000; transform: translate(-50%,-50%); }
  #cur-ring { position: fixed; width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); transition: all 0.3s; }
  .vignette { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, transparent 30%, #000 140%); z-index: 5; pointer-events: none; }
</style>
</head>
<body>
<div class="vignette"></div>
<div id="cur"></div>
<div id="cur-ring"></div>
<canvas id="c"></canvas>
<div id="hud">
  <header class="hud-header"><div class="hud-tag">ID // LUXURY_CHAMBER_05</div></header>
  <div class="scene-info">
    <span class="scene-num">MODULE 05</span>
    <h1 class="scene-title">NEURAL<br>CHAMBER</h1>
    <p class="scene-desc">El centro de estética y refinamiento sensorial. La IA procesa aquí la belleza mediante algoritmos de metal líquido y luz dorada.</p>
  </div>
  <footer class="hud-footer"><a href="../web3d.html" class="back-btn">RETURN TO HUB</a></footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const s = new THREE.Scene(); s.fog = new THREE.FogExp2(0x03040a, 0.05);
  const c = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100); c.position.z = 20;
  const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight);

  // Liquid Gold Sphere DNA
  const geo = new THREE.SphereGeometry(5, 128, 128);
  const mat = new THREE.MeshStandardMaterial({color:0xc8a97a, metalness:1, roughness:0.1});
  const sphere = new THREE.Mesh(geo, mat); s.add(sphere);

  const l1 = new THREE.PointLight(0xffffff, 2, 50); l1.position.set(10, 10, 10); s.add(l1);
  const l2 = new THREE.PointLight(0xc8a97a, 4, 50); l2.position.set(-10, -5, 10); s.add(l2);
  s.add(new THREE.AmbientLight(0x222222));

  let mx=0, my=0; window.addEventListener('mousemove', e=>{
    mx=(e.clientX/innerWidth-0.5)*2; my=-(e.clientY/innerHeight-0.5)*2;
    gsap.to('#cur', {x:e.clientX, y:e.clientY, duration:0.1}); gsap.to('#cur-ring', {x:e.clientX, y:e.clientY, duration:0.4});
  });

  const origPos = geo.attributes.position.clone();
  function anim(t){
    requestAnimationFrame(anim);
    const time = t*0.001;
    const pos = geo.attributes.position;
    for(let i=0; i<pos.count; i++){
      const v = new THREE.Vector3().fromBufferAttribute(origPos, i);
      const noise = Math.sin(v.x*2 + time) * Math.cos(v.y*2 + time);
      v.multiplyScalar(1 + noise*0.04);
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    pos.needsUpdate = true; geo.computeVertexNormals();
    sphere.rotation.y = time*0.1;
    c.position.x += (mx*5 - c.position.x)*0.05; c.position.y += (my*5 - c.position.y)*0.05; c.lookAt(0,0,0);
    r.render(s, c);
  } anim(0);
</script>
</body>
</html>
