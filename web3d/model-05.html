<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DIGITAL LUXURY // OMEGA.05</title>
<style>
  body { margin:0; overflow:hidden; background:#000; cursor:none; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  h1 { font-family:serif; font-style:italic; font-size:10vw; color:#fff; mix-blend-mode:difference; font-weight:100; margin:0; }
  .btn { position:absolute; bottom:5vh; padding:15px 40px; border:1px solid #c8a97a; color:#c8a97a; text-decoration:none; font-family:sans-serif; font-size:10px; letter-spacing:4px; text-transform:uppercase; transition:0.4s; pointer-events:all; }
  .btn:hover { background:#c8a97a; color:#000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>Aura</h1>
  <a href="../web3d.html" class="btn">DEPART</a>
</div>
<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
  const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
  const scene = new THREE.Scene(); const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const geo = new THREE.PlaneGeometry(2, 2);
  const mat = new THREE.ShaderMaterial({
    uniforms: { u_time: {value:0}, u_res: {value:new THREE.Vector2(innerWidth, innerHeight)}, u_mouse: {value:new THREE.Vector2(0,0)} },
    vertexShader: `void main(){ gl_Position = vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float u_time; uniform vec2 u_res; uniform vec2 u_mouse;
      float fbm(vec2 p){ return sin(p.x)+cos(p.y); }
      void main(){
        vec2 uv = (gl_FragCoord.xy - 0.5*u_res.xy)/u_res.y;
        vec2 m = u_mouse * 0.5;
        
        // Liquid math
        float d = length(uv - m);
        vec2 q = vec2(fbm(uv + u_time*0.2), fbm(uv + vec2(1.0)));
        vec2 r = vec2(fbm(uv + 1.0*q + vec2(1.7,9.2)+ 0.15*u_time), fbm(uv + 1.0*q + vec2(8.3,2.8)+ 0.126*u_time));
        float f = fbm(uv + r);
        
        // Gold/Titanium palette
        vec3 col = mix(vec3(0.0), vec3(0.8, 0.6, 0.3), f);
        col = mix(col, vec3(1.0, 0.9, 0.6), dot(r,r)*0.5);
        
        // Ripple from mouse
        col += vec3(1.0) * exp(-d*10.0) * sin(d*50.0 - u_time*10.0) * 0.2;
        
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(geo, mat));
  let mx=0, my=0; window.addEventListener('mousemove', e=>{ mx=(e.clientX-innerWidth/2)/innerHeight; my=-(e.clientY-innerHeight/2)/innerHeight; });
  window.addEventListener('resize', ()=>{ renderer.setSize(innerWidth, innerHeight); mat.uniforms.u_res.value.set(innerWidth,innerHeight); });
  function anim(t){
    requestAnimationFrame(anim);
    mat.uniforms.u_time.value = t*0.001;
    mat.uniforms.u_mouse.value.x += (mx - mat.uniforms.u_mouse.value.x)*0.1;
    mat.uniforms.u_mouse.value.y += (my - mat.uniforms.u_mouse.value.y)*0.1;
    renderer.render(scene, camera);
  } anim(0);
</script>
</body>
</html>
