<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MATRIX NET // OMEGA.06</title>
<style>
  body { margin:0; overflow:hidden; background:#000; cursor:none; font-family:monospace; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; color:#0f0; padding:20px; text-shadow:0 0 5px #0f0; }
  .btn { position:absolute; bottom:20px; right:20px; padding:10px 20px; border:1px solid #0f0; color:#0f0; text-decoration:none; pointer-events:all; transition:0.2s; background:rgba(0,255,0,0.1); }
  .btn:hover { background:#0f0; color:#000; box-shadow:0 0 20px #0f0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div>> ROOT ACCESS GRANTED</div>
  <div id="hex"></div>
  <a href="../web3d.html" class="btn">JACK OUT</a>
</div>
<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
  const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c')});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
  const scene = new THREE.Scene(); const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const geo = new THREE.PlaneGeometry(2, 2);
  const mat = new THREE.ShaderMaterial({
    uniforms: { u_time: {value:0}, u_res: {value:new THREE.Vector2(innerWidth, innerHeight)} },
    vertexShader: `void main(){ gl_Position = vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float u_time; uniform vec2 u_res;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123); }
      void main(){
        vec2 uv = gl_FragCoord.xy / u_res.xy;
        uv.x *= u_res.x/u_res.y;
        
        // Digital Rain simplified
        vec2 grid = floor(uv * 50.0);
        vec2 fuv = fract(uv * 50.0);
        
        float drop = hash(grid + floor(u_time * 10.0));
        float col = step(0.95, drop) * step(0.2, fuv.y);
        
        // Scanlines
        col *= sin(gl_FragCoord.y * 2.0) * 0.2 + 0.8;
        
        // 3D perspective illusion grid
        vec2 p = (gl_FragCoord.xy * 2.0 - u_res.xy) / u_res.y;
        float z = 1.0 / abs(p.y + 0.1);
        vec2 grid3d = vec2(p.x * z, z) * 10.0;
        float mask = step(0.1, p.y + 0.1); // floor only
        float lines = (step(0.9, fract(grid3d.x)) + step(0.9, fract(grid3d.y - u_time*5.0))) * mask;
        
        vec3 finalCol = vec3(0.0, 1.0, 0.2) * (col + lines*exp(-z*0.1));
        gl_FragColor = vec4(finalCol, 1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(geo, mat));
  window.addEventListener('resize', ()=>{ renderer.setSize(innerWidth, innerHeight); mat.uniforms.u_res.value.set(innerWidth,innerHeight); });
  function anim(t){
    requestAnimationFrame(anim);
    mat.uniforms.u_time.value = t*0.001;
    document.getElementById('hex').innerText = Math.random().toString(16).toUpperCase();
    renderer.render(scene, camera);
  } anim(0);
</script>
</body>
</html>
