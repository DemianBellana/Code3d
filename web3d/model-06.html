<!DOCTYPE html>
<html lang="es" class="layout-central">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CORPORATE CORE // OMEGA.06</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@200;400;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web3d/3d-style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="vignette"></div>
<div id="cur"></div>
<canvas id="c"></canvas>
<div id="hud">
  <header><div class="tag">ID // PORTAL_SECTOR_06</div></header>
  <div class="scene-info glass-panel">
    <h1 class="title">DIMENSIONAL<br>GATEWAY</h1>
    <p class="desc">Punto de enlace cuántico entre la consciencia digital y el multiverso.</p>
  </div>
  <footer><a href="../web3d.html" class="btn-back">RETURN TO HUB</a></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script type="module">
  import * as THREE from 'three';
  window.THREE = THREE;
</script>
<script type="module">
  import { VisualUpgrader } from '/web3d/visual-upgrader.js';
  const s = new THREE.Scene();
  const c = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000); 
  const initialZ = 20;
  c.position.z = initialZ;
  const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight);

  const vu = new VisualUpgrader(r, s, c);

  const torus = new THREE.Mesh(new THREE.TorusGeometry(6, 0.5, 32, 100), new THREE.MeshStandardMaterial({ color: 0x00ffe0, emissive: 0x004444 }));
  s.add(torus);

  function updateCam() {
    c.aspect = window.innerWidth / window.innerHeight;
    c.position.z = initialZ * (c.aspect < 1 ? 1.7 : 1);
    c.updateProjectionMatrix();
    r.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', updateCam);
  updateCam();

  function anim(t){
    requestAnimationFrame(anim);
    torus.rotation.z = t*0.0005;
    vu.render(t*0.001);
  } anim(0);
</script>
</body>
</html>
