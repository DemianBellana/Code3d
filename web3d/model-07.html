<!DOCTYPE html>
<html lang="es" class="layout-minimal">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TACTICAL NEXUS // OMEGA.07</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web3d/3d-style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="vignette"></div>
<div id="cur"></div>
<canvas id="c"></canvas>
<div id="hud">
  <header><div class="tag">ID // NEXUS_SECTOR_07</div></header>
  <div class="scene-info">
    <h1 class="title">TACTICAL NEXUS</h1>
    <p class="desc">Centro de comando táctico y visualización de amenazas globales.</p>
  </div>
  <footer><a href="../web3d.html" class="btn-back">RETURN TO HUB</a></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script type="module">
  import * as THREE from 'three';
  window.THREE = THREE;
</script>
<script type="module">
  import { VisualUpgrader } from '/web3d/visual-upgrader.js';
  const s = new THREE.Scene();
  const c = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000); 
  const initialZ = 20;
  c.position.z = initialZ;
  const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight);

  const vu = new VisualUpgrader(r, s, c);

  const sphere = new THREE.Mesh(new THREE.SphereGeometry(6, 32, 32), new THREE.MeshStandardMaterial({ color: 0xff3c3c, wireframe: true }));
  s.add(sphere);

  function updateCam() {
    c.aspect = window.innerWidth / window.innerHeight;
    c.position.z = initialZ * (c.aspect < 1 ? 1.6 : 1);
    c.updateProjectionMatrix();
    r.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', updateCam);
  updateCam();

  function anim(t){
    requestAnimationFrame(anim);
    sphere.rotation.y = t*0.0004;
    vu.render(t*0.001);
  } anim(0);
</script>
</body>
</html>
