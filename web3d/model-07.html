<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IMMERSIVE PORTAL // OMEGA.07</title>
<style>
  body { margin:0; overflow:hidden; background:#000; cursor:crosshair; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; display:flex; justify-content:center; align-items:center; }
  .btn { position:absolute; bottom:40px; padding:15px 40px; background:transparent; border:1px solid #ff00ff; color:#ff00ff; text-decoration:none; font-family:monospace; font-size:12px; letter-spacing:4px; border-radius:30px; pointer-events:all; transition:0.3s; backdrop-filter:blur(5px); }
  .btn:hover { background:#ff00ff; color:#000; box-shadow:0 0 40px #ff00ff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><a href="../web3d.html" class="btn">LEAVE DIMENSION</a></div>
<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
  const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
  const scene = new THREE.Scene(); const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const mat = new THREE.ShaderMaterial({
    uniforms: { u_time: {value:0}, u_res: {value:new THREE.Vector2(innerWidth, innerHeight)}, u_mouse: {value:new THREE.Vector2(0,0)} },
    vertexShader: `void main(){ gl_Position = vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float u_time; uniform vec2 u_res; uniform vec2 u_mouse;
      void main(){
        vec2 uv = (gl_FragCoord.xy - 0.5*u_res.xy)/u_res.y;
        vec2 m = u_mouse*0.5;
        float d = length(uv - m);
        float a = atan(uv.y - m.y, uv.x - m.x);
        
        // Tunnel math
        float r = 0.5 / d;
        float u = r + u_time * 2.0;
        float v = a * 3.0 + sin(u_time + r)*0.5;
        
        float grid = sin(u * 10.0) * sin(v * 10.0);
        vec3 col = vec3(0.5 + 0.5*sin(u_time), 0.0, 0.5 + 0.5*cos(u_time));
        col *= smoothstep(0.0, 0.1, grid);
        col *= exp(-d * 2.0); // fade in center
        col += vec3(1.0, 0.0, 1.0) * exp(-d * 10.0); // glowing core
        
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat));
  let mx=0, my=0; window.addEventListener('mousemove', e=>{ mx=e.clientX/innerWidth-0.5; my=-(e.clientY/innerHeight-0.5); });
  window.addEventListener('resize', ()=>{ renderer.setSize(innerWidth, innerHeight); mat.uniforms.u_res.value.set(innerWidth,innerHeight); });
  function anim(t){
    requestAnimationFrame(anim);
    mat.uniforms.u_time.value = t*0.001;
    mat.uniforms.u_mouse.value.x += (mx - mat.uniforms.u_mouse.value.x)*0.1;
    mat.uniforms.u_mouse.value.y += (my - mat.uniforms.u_mouse.value.y)*0.1;
    renderer.render(scene, camera);
  } anim(0);
</script>
</body>
</html>
