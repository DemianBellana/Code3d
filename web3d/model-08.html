<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FUTURE CITY // OMEGA.08</title>
<style>
  body { margin:0; overflow:hidden; background:#000; cursor:none; font-family:sans-serif; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; box-shadow:inset 0 0 100px rgba(255,0,0,0.5); }
  .btn { position:absolute; top:20px; left:20px; padding:10px 20px; background:rgba(255,0,0,0.3); border:1px solid #f00; color:#f00; text-decoration:none; font-weight:bold; letter-spacing:2px; pointer-events:all; transition:0.3s; }
  .btn:hover { background:#f00; color:#000; box-shadow:0 0 20px #f00; }
  .target { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:50px; height:50px; border:2px solid #f00; border-radius:50%; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><a href="../web3d.html" class="btn">EVACUATE</a><div class="target"></div></div>
<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
  const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c')});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
  const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x0a0000, 0.05);
  const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100); camera.position.set(0, 10, 20);
  
  // City
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.MeshBasicMaterial({color:0x220000, wireframe:true});
  const imesh = new THREE.InstancedMesh(geo, mat, 500);
  const dummy = new THREE.Object3D();
  for(let i=0; i<500; i++){
    const h = 2 + Math.random()*15;
    dummy.position.set((Math.random()-0.5)*100, h/2 - 5, (Math.random()-0.5)*100);
    dummy.scale.set(1.5, h, 1.5); dummy.updateMatrix();
    imesh.setMatrixAt(i, dummy.matrix);
  }
  scene.add(imesh);

  let mx=0, my=0; window.addEventListener('mousemove', e=>{ mx=e.clientX/innerWidth-0.5; my=-(e.clientY/innerHeight-0.5); });
  window.addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

  function anim(t){
    requestAnimationFrame(anim);
    camera.position.z -= 0.1; // fly forward
    if(camera.position.z < -20) camera.position.z = 20;
    camera.position.x += (mx*10 - camera.position.x)*0.05;
    camera.position.y += (10 + my*10 - camera.position.y)*0.05;
    camera.lookAt(0, 5, camera.position.z - 20);
    renderer.render(scene, camera);
  } anim(0);
</script>
</body>
</html>
