<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COMMAND CENTER // OMEGA.09</title>
<style>
  body { margin:0; overflow:hidden; background:#000; cursor:crosshair; font-family:monospace; color:#f33; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; background:linear-gradient(rgba(255,0,0,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,0,0,0.05) 1px, transparent 1px); background-size:30px 30px; }
  .panel { position:absolute; right:20px; top:20px; border:1px solid #f33; background:rgba(0,0,0,0.8); padding:20px; }
  .btn { display:block; margin-top:20px; padding:10px; background:#f33; color:#000; text-decoration:none; text-align:center; font-weight:bold; pointer-events:all; }
  .btn:hover { background:#fff; box-shadow:0 0 20px #f33; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="panel">
    <h3>TACTICAL MAP</h3>
    <p>RENDER: POINTS</p>
    <a href="../web3d.html" class="btn">SHUTDOWN</a>
  </div>
</div>
<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
  const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c')});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
  const scene = new THREE.Scene(); const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100); camera.position.set(0, 20, 20); camera.lookAt(0,0,0);
  
  const geo = new THREE.BufferGeometry(); const pos = new Float32Array(10000*3);
  for(let i=0;i<10000;i++){
    const r = Math.random()*15; const theta = Math.random()*Math.PI*2;
    pos[i*3]=r*Math.cos(theta); pos[i*3+1]=Math.sin(r*2)*2; pos[i*3+2]=r*Math.sin(theta);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const points = new THREE.Points(geo, new THREE.PointsMaterial({color:0xff3c3c, size:0.1, blending:THREE.AdditiveBlending, transparent:true}));
  scene.add(points);

  let mx=0, my=0; window.addEventListener('mousemove', e=>{ mx=e.clientX/innerWidth-0.5; my=-(e.clientY/innerHeight-0.5); });
  window.addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

  function anim(t){
    requestAnimationFrame(anim);
    points.rotation.y = t*0.0005;
    const pa = geo.attributes.position.array;
    for(let i=0; i<10000; i++){ pa[i*3+1] = Math.sin(Math.sqrt(pa[i*3]*pa[i*3]+pa[i*3+2]*pa[i*3+2])*2 - t*0.002)*2; }
    geo.attributes.position.needsUpdate = true;
    camera.position.x += (mx*10 - camera.position.x)*0.05;
    camera.position.z += (20 + my*10 - camera.position.z)*0.05; camera.lookAt(0,0,0);
    renderer.render(scene, camera);
  } anim(0);
</script>
</body>
</html>
