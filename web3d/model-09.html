<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TACTICAL NEXUS // OMEGA.09</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --red: #ff3c3c; --bg: #03040a; --glass: rgba(255, 60, 60, 0.05); --border: rgba(255, 60, 60, 0.3); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: #fff; overflow: hidden; font-family: 'Rajdhani', sans-serif; cursor: none; }
  canvas { position: fixed; inset: 0; z-index: 0; }
  #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; padding: 3rem; display: flex; flex-direction: column; justify-content: space-between; }
  .hud-tag { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.3em; color: var(--red); background: rgba(255,60,60,0.05); padding: 0.5rem 1rem; border: 1px solid var(--border); backdrop-filter: blur(10px); }
  .scene-info { position: absolute; top: 2rem; right: 3rem; width: 300px; border: 1px solid var(--border); background: rgba(0,0,0,0.85); padding: 2rem; pointer-events: all; }
  .scene-title { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem; border-bottom: 1px solid var(--red); padding-bottom: 0.5rem; }
  .stat { display: flex; justify-content: space-between; font-family: 'DM Mono', monospace; font-size: 0.75rem; margin-bottom: 0.5rem; }
  .back-btn { pointer-events: all; text-decoration: none; color: #fff; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; letter-spacing: 0.3em; padding: 1rem 2rem; border: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(20px); border-radius: 4px; transition: all 0.4s; display: block; text-align: center; margin-top: 1.5rem; }
  .back-btn:hover { background: var(--red); color: #000; }
  #cur { position: fixed; width: 8px; height: 8px; background: var(--red); border-radius: 50%; pointer-events: none; z-index: 10000; transform: translate(-50%,-50%); }
  #cur-ring { position: fixed; width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); transition: all 0.3s; }
</style>
</head>
<body>
<div id="cur"></div>
<div id="cur-ring"></div>
<canvas id="c"></canvas>
<div id="hud">
  <header class="hud-header"><div class="hud-tag">ID // TACTICAL_NEXUS_09</div></header>
  <div class="scene-info">
    <h1 class="scene-title">NEXUS_CORE</h1>
    <div class="stat"><span>THREAT</span><span style="color:red">CRITICAL</span></div>
    <div class="stat"><span>UPLINK</span><span>ACTIVE</span></div>
    <div class="stat"><span>LATENCY</span><span>0.4ms</span></div>
    <a href="../web3d.html" class="back-btn">DISCONNECT</a>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const s = new THREE.Scene(); s.fog = new THREE.FogExp2(0x03040a, 0.05);
  const c = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100); c.position.set(0, 15, 25);
  const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight);

  // Globe DNA
  const globe = new THREE.Mesh(new THREE.SphereGeometry(8, 32, 32), new THREE.MeshBasicMaterial({color:0xff3c3c, wireframe:true, transparent:true, opacity:0.1})); s.add(globe);
  const nodes = new THREE.Points(new THREE.SphereGeometry(8.1, 32, 32), new THREE.PointsMaterial({color:0xffffff, size:0.1})); globe.add(nodes);

  let mx=0, my=0; window.addEventListener('mousemove', e=>{
    mx=(e.clientX/innerWidth-0.5)*2; my=-(e.clientY/innerHeight-0.5)*2;
    gsap.to('#cur', {x:e.clientX, y:e.clientY, duration:0.1}); gsap.to('#cur-ring', {x:e.clientX, y:e.clientY, duration:0.4});
  });

  function anim(t){
    requestAnimationFrame(anim);
    globe.rotation.y = t*0.0005;
    c.position.x += (mx*10 - c.position.x)*0.05; c.position.y += (15 + my*5 - c.position.y)*0.05; c.lookAt(0,0,0);
    r.render(s, c);
  } anim(0);
</script>
</body>
</html>
