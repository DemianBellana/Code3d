<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COMMAND CENTER // OMEGA.09</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; background:#020000; color:#ff3c3c; font-family:'Share Tech Mono', monospace; overflow:hidden; background-image:linear-gradient(rgba(255,60,60,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,60,60,0.05) 1px, transparent 1px); background-size:50px 50px; background-position:center center; }
  canvas { position:fixed; inset:0; z-index:0; }
  #ui { position:absolute; top:2rem; right:2rem; width:320px; background:rgba(0,0,0,0.85); border:1px solid #ff3c3c; padding:2rem; z-index:10; box-shadow:0 0 20px rgba(255,60,60,0.2); pointer-events:all; }
  .title { font-size:1.5rem; margin-bottom:1rem; border-bottom:1px solid #ff3c3c; padding-bottom:0.5rem; }
  .row { display:flex; justify-content:space-between; margin-bottom:0.5rem; font-size:0.9rem; }
  .val { color:#fff; }
  .btn { display:block; text-align:center; padding:1rem; margin-top:2rem; background:rgba(255,60,60,0.2); color:#ff3c3c; text-decoration:none; transition:all 0.3s; border:1px solid #ff3c3c; }
  .btn:hover { background:#ff3c3c; color:#000; }
  @media(max-width:768px){ #ui{top:auto; bottom:2rem; right:1.5rem; left:1.5rem; width:auto;} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="title">GLOBAL_TAC_COM</div>
  <div class="row"><span>THREAT LEVEL</span><span class="val" style="color:red">CRITICAL</span></div>
  <div class="row"><span>SATELLITE LINK</span><span class="val">SECURE</span></div>
  <div class="row"><span>GLOBAL NODES</span><span class="val" id="nodes">8492</span></div>
  <a href="../web3d.html" class="btn">END SIMULATION</a>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const s = new THREE.Scene();
  const c = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100); c.position.set(-10, 5, 20);
  const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true, alpha:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); r.setSize(innerWidth, innerHeight);

  // Wireframe Globe
  const geo = new THREE.SphereGeometry(8, 32, 32);
  const mat = new THREE.MeshBasicMaterial({color:0xff3c3c, wireframe:true, transparent:true, opacity:0.15});
  const globe = new THREE.Mesh(geo, mat); s.add(globe);

  // Nodes on Globe
  const pGeo = new THREE.BufferGeometry(); const pPos = new Float32Array(500*3);
  for(let i=0;i<500;i++){
    const phi = Math.acos(2*Math.random()-1); const theta = Math.random()*Math.PI*2;
    pPos[i*3]=8*Math.sin(phi)*Math.cos(theta); pPos[i*3+1]=8*Math.sin(phi)*Math.sin(theta); pPos[i*3+2]=8*Math.cos(phi);
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
  const pMat = new THREE.PointsMaterial({color:0xffffff, size:0.2});
  const nodes = new THREE.Points(pGeo, pMat); globe.add(nodes);

  // Radar plane
  const pGeo2 = new THREE.PlaneGeometry(30, 30); pGeo2.rotateX(-Math.PI/2);
  const pMat2 = new THREE.MeshBasicMaterial({color:0xff3c3c, wireframe:true, transparent:true, opacity:0.1});
  const plane = new THREE.Mesh(pGeo2, pMat2); plane.position.y = -9; s.add(plane);

  let mx=0, my=0; window.addEventListener('mousemove', e => { mx=(e.clientX/innerWidth-0.5)*2; my=-(e.clientY/innerHeight-0.5)*2; });
  window.addEventListener('resize', () => { c.aspect=innerWidth/innerHeight; c.updateProjectionMatrix(); r.setSize(innerWidth,innerHeight); });

  function anim() {
    requestAnimationFrame(anim);
    globe.rotation.y += 0.005; plane.rotation.z -= 0.01;
    c.position.x += (-10 + mx*5 - c.position.x)*0.05; c.position.y += (5 + my*5 - c.position.y)*0.05; c.lookAt(globe.position);
    document.getElementById('nodes').innerText = Math.floor(8000 + Math.random()*1000);
    r.render(s, c);
  } anim();
</script>
</body>
</html>
