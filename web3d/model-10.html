<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GOD TIER // OMEGA.10</title>
<style>
  body { margin:0; overflow:hidden; background:#000; cursor:none; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; display:flex; justify-content:center; align-items:center; mix-blend-mode:difference; }
  h1 { font-family:sans-serif; font-size:15vw; color:#fff; margin:0; line-height:1; letter-spacing:-5px; }
  .btn { position:absolute; bottom:5vh; padding:15px 40px; border:2px solid #fff; color:#fff; text-decoration:none; font-family:sans-serif; font-size:12px; font-weight:900; letter-spacing:5px; pointer-events:all; transition:0.3s; }
  .btn:hover { background:#fff; color:#000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><h1>OMNIPRESENCE</h1><a href="../web3d.html" class="btn">RETURN TO REALITY</a></div>
<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
  const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
  const scene = new THREE.Scene(); const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const mat = new THREE.ShaderMaterial({
    uniforms: { u_time: {value:0}, u_res: {value:new THREE.Vector2(innerWidth, innerHeight)}, u_mouse: {value:new THREE.Vector2(0,0)} },
    vertexShader: `void main(){ gl_Position = vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float u_time; uniform vec2 u_res; uniform vec2 u_mouse;
      void main(){
        vec2 uv = (gl_FragCoord.xy - 0.5*u_res.xy)/u_res.y;
        vec2 m = u_mouse;
        float t = u_time * 0.5;
        
        // Fractal math (Mandelbox logic simplified)
        vec3 p = vec3(uv * 2.0, t);
        for(int i=0; i<4; i++){
          p = abs(p) / dot(p,p) - vec3(0.5);
        }
        
        float intensity = length(p);
        vec3 col = vec3(sin(intensity*10.0), cos(intensity*12.0), sin(intensity*15.0));
        col *= exp(-length(uv)*2.0); // Vignette
        
        // Extreme aberration on mouse move
        col.r += sin(intensity*10.0 + m.x*10.0)*0.5;
        col.b += cos(intensity*15.0 + m.y*10.0)*0.5;
        
        gl_FragColor = vec4(abs(col), 1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat));
  let mx=0, my=0; window.addEventListener('mousemove', e=>{ mx=e.clientX/innerWidth-0.5; my=-(e.clientY/innerHeight-0.5); });
  window.addEventListener('resize', ()=>{ renderer.setSize(innerWidth, innerHeight); mat.uniforms.u_res.value.set(innerWidth,innerHeight); });
  function anim(t){
    requestAnimationFrame(anim);
    mat.uniforms.u_time.value = t*0.001;
    mat.uniforms.u_mouse.value.x += (mx - mat.uniforms.u_mouse.value.x)*0.1;
    mat.uniforms.u_mouse.value.y += (my - mat.uniforms.u_mouse.value.y)*0.1;
    renderer.render(scene, camera);
  } anim(0);
</script>
</body>
</html>
