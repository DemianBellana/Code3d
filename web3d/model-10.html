<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRANSCENDENCE // OMEGA.10</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --white: #ffffff; --bg: #000; --glass: rgba(255, 255, 255, 0.02); --border: rgba(255, 255, 255, 0.3); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: #fff; overflow: hidden; font-family: 'Rajdhani', sans-serif; cursor: none; }
  canvas { position: fixed; inset: 0; z-index: 0; }
  #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; mix-blend-mode: difference; }
  .title { font-family: 'Orbitron', sans-serif; font-size: clamp(4rem, 15vw, 12rem); font-weight: 900; letter-spacing: 0.2em; }
  .back-btn { pointer-events: all; text-decoration: none; color: #fff; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; letter-spacing: 0.5em; padding: 1.5rem 4rem; border: 2px solid #fff; background: transparent; transition: all 0.4s; position: absolute; bottom: 8vh; }
  .back-btn:hover { background: #fff; color: #000; }
  #cur { position: fixed; width: 6px; height: 6px; background: #fff; border-radius: 50%; pointer-events: none; z-index: 10000; transform: translate(-50%,-50%); }
</style>
</head>
<body>
<div id="cur"></div>
<canvas id="c"></canvas>
<div id="hud">
  <h1 class="title">OMNIPRESENCE</h1>
  <a href="../web3d.html" class="back-btn">ASCEND</a>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  const s = new THREE.Scene();
  const c = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000); c.position.z = 20;
  const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight);

  // Fractal DNA (Abstract Geometry)
  const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(8, 2, 200, 32), new THREE.MeshBasicMaterial({color:0xffffff, wireframe:true, transparent:true, opacity:0.15})); s.add(knot);

  let mx=0, my=0; window.addEventListener('mousemove', e=>{
    mx=(e.clientX/innerWidth-0.5)*2; my=-(e.clientY/innerHeight-0.5)*2;
    gsap.to('#cur', {x:e.clientX, y:e.clientY, duration:0.1});
  });

  function anim(t){
    requestAnimationFrame(anim);
    const time = t*0.0005;
    knot.rotation.x = time; knot.rotation.y = time*1.2;
    knot.scale.setScalar(1 + Math.sin(time*5)*0.1);
    c.position.x += (mx*10 - c.position.x)*0.05; c.position.y += (my*10 - c.position.y)*0.05; c.lookAt(0,0,0);
    r.render(s, c);
  } anim(0);
</script>
</body>
</html>
