<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GOD TIER // OMEGA.10</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; background:#000; overflow:hidden; font-family:'Orbitron', sans-serif; cursor:none; }
  canvas { position:fixed; inset:0; z-index:0; }
  #ui { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:10; pointer-events:none; mix-blend-mode:difference; }
  .title { font-size:clamp(4rem, 15vw, 12rem); color:#fff; margin:0; line-height:1; letter-spacing:2vw; padding-left:2vw; animation:shake 0.5s infinite alternate; }
  .sub { font-size:1rem; color:#fff; letter-spacing:1em; margin-top:2rem; text-transform:uppercase; animation:shake 1s infinite alternate-reverse; }
  .btn { pointer-events:all; margin-top:5rem; padding:1.5rem 4rem; background:#fff; color:#000; text-decoration:none; font-size:1rem; font-weight:900; letter-spacing:0.3em; transition:all 0.2s; mix-blend-mode:normal; }
  .btn:hover { background:transparent; color:#fff; border:1px solid #fff; box-shadow:0 0 50px #fff; }
  @keyframes shake { 0%{transform:translate(1px,1px) rotate(0deg);} 100%{transform:translate(-1px,-2px) rotate(-1deg);} }
  .vignette { position:fixed; inset:0; background:radial-gradient(circle, transparent 40%, #000 120%); pointer-events:none; z-index:5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div id="ui">
  <h1 class="title">GOD</h1>
  <div class="sub">SINGULARITY REACHED</div>
  <a href="../web3d.html" class="btn">AWAKEN</a>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const s = new THREE.Scene();
  const c = new THREE.PerspectiveCamera(90, innerWidth/innerHeight, 0.1, 1000); c.position.z = 10;
  const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); r.setSize(innerWidth, innerHeight);

  // Intense Abstract Geometry
  const geo = new THREE.TorusKnotGeometry(3, 1, 200, 32);
  const mat = new THREE.MeshStandardMaterial({color:0xffb800, metalness:1, roughness:0.2, wireframe:true});
  const mesh = new THREE.Mesh(geo, mat); s.add(mesh);

  const geo2 = new THREE.IcosahedronGeometry(6, 1);
  const mat2 = new THREE.MeshBasicMaterial({color:0xffffff, wireframe:true, transparent:true, opacity:0.1});
  const mesh2 = new THREE.Mesh(geo2, mat2); s.add(mesh2);

  const l1 = new THREE.PointLight(0xffffff, 5, 50); l1.position.set(0,0,0); s.add(l1);
  
  let mx=0, my=0; window.addEventListener('mousemove', e => { mx=(e.clientX/innerWidth-0.5)*2; my=-(e.clientY/innerHeight-0.5)*2; });
  window.addEventListener('resize', () => { c.aspect=innerWidth/innerHeight; c.updateProjectionMatrix(); r.setSize(innerWidth,innerHeight); });

  function anim(t) {
    requestAnimationFrame(anim);
    const time = t * 0.005; // Fast erratic
    mesh.rotation.x = time; mesh.rotation.y = time*1.2;
    mesh2.rotation.x = -time*0.5; mesh2.rotation.y = -time*0.5;
    
    const sFact = 1 + Math.sin(time*5)*0.1; mesh.scale.set(sFact,sFact,sFact);
    
    // Erratic camera
    c.position.x += (mx*2 + Math.sin(time*10)*0.5 - c.position.x)*0.1; 
    c.position.y += (my*2 + Math.cos(time*12)*0.5 - c.position.y)*0.1;
    c.lookAt(0,0,0);
    
    // Flicker light
    l1.intensity = 2 + Math.random()*5;
    
    r.render(s, c);
  } anim(0);
</script>
</body>
</html>
